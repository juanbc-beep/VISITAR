        ${log.length?log.map(e=>`<div class="arow"><div class="grow2"><div class="pnm">${E(e.who||'—')} · <span style="font-weight:500;color:var(--ink-2)">${E(e.action)}</span>${e.code?` <span class="mono" style="color:var(--accent-ink)">${E(e.code)}</span>`:''}</div><div class="pmeta">${fmt(e.t)}</div></div></div>`).join(''):'<div class="ahint">Todavía no hay cambios registrados.</div>'}
        ${log.length?'<button class="minibtn danger" id="logClear" style="margin-top:10px">Vaciar registro</button>':''}`;
      if(el('logClear'))el('logClear').addEventListener('click',()=>{if(confirm('¿Vaciar el registro de cambios?')){CONTENT.log=[];persistContent();renderPane();}});
    } else if(aTab==='respaldo'){
      p.innerHTML=`<div class="ahint">Descargá un respaldo con perfiles y ediciones, o restauralo en otra computadora. (Con la nube activada esto es automático; el respaldo sirve igual como copia de seguridad.)</div>
        <button class="minibtn" id="bkExp" style="margin-top:10px">⬇ Descargar respaldo (.json)</button>
        <label style="margin-top:16px">Restaurar desde archivo</label>
        <input id="bkImp" type="file" accept="application/json,.json" style="border:none;padding:6px 0;background:none">
        <div class="ahint" style="color:var(--urg);margin-top:6px">Restaurar reemplaza los perfiles y ediciones de este equipo.</div>`;
      el('bkExp').addEventListener('click',()=>{
        const blob=new Blob([JSON.stringify({auth:AUTH,content:CONTENT},null,1)],{type:'application/json'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NBU_respaldo.json';a.click();
      });
      el('bkImp').addEventListener('change',e=>{
        const f=e.target.files[0];if(!f)return;const rd=new FileReader();
        rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.auth){AUTH=d.auth;save(KEY.auth,AUTH);}if(d.content){CONTENT=d.content;save(KEY.content,CONTENT);}applyContent();persistAuth();persistContent();renderPane();render();toast('Respaldo restaurado');}catch(err){toast('Archivo inválido',true);}};
        rd.readAsText(f);
      });
    }
  }
  async function flushPushAll(){pushQ.auth=AUTH;pushQ.content=CONTENT;await flushPush();}
  function profAction(act,id){
    const pr=AUTH.profiles.find(x=>x.id===id);if(!pr)return;
    if(act==='role'){
      if(pr.role==='admin'&&AUTH.profiles.filter(x=>x.role==='admin').length<=1)return toast('Debe quedar al menos un administrador',true);
      pr.role=pr.role==='admin'?'user':'admin';pr.updated=Date.now();persistAuth();
      if(current&&current.id===id){const adm=pr.role==='admin';el('adminBtn').hidden=!adm;el('editModeBtn').hidden=!adm;if(!adm){editMode=false;document.body.classList.remove('editmode-on');closeAdmin();}}
      renderPane();
    } else if(act==='reset'){
      const np=prompt('Nueva contraseña para '+pr.name+' (mín. 4):');if(!np)return;if(np.length<4)return toast('Muy corta',true);
      mkHash(np).then(h=>{pr.hash=h.hash;pr.salt=h.salt;pr.it=h.it;pr.updated=Date.now();persistAuth();toast('Contraseña actualizada');});
    } else if(act==='del'){
      if(current&&current.id===id)return toast('No podés eliminar tu propio perfil en uso',true);
      if(pr.role==='admin'&&AUTH.profiles.filter(x=>x.role==='admin').length<=1)return toast('Debe quedar al menos un administrador',true);
      if(!confirm('¿Eliminar el perfil "'+pr.name+'"? Se pierden sus favoritos.'))return;
      AUTH.profiles=AUTH.profiles.filter(x=>x.id!==id);persistAuth();renderPane();toast('Perfil eliminado');
    }
  }

  /* ============ EDITOR DE FICHA ============ */
  function editFicha(code){
    const c=BYCODE[code];if(!c)return;
    const o=c._orig||{};const norma=c.norma||{};
    abox.innerHTML=`
      <button class="icon-btn close-x" id="aClose" style="position:absolute;top:16px;right:16px" aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <h3>Editar ficha · ${E(c.code)}</h3>
      <div class="asub">Los cambios se guardan para todo el equipo. El original queda respaldado (podés restaurarlo).</div>
      <label>Nombre / denominación</label><input id="efNom" type="text" value="${E(c.nombre)}">
      <label>Norma mínima de trabajo</label><textarea id="efTrab">${E(norma.trabajo||'')}</textarea>
      <label>Interpretación</label><textarea id="efInt">${E(norma.interpretacion||'')}</textarea>
      <label>Normas de auditoría / facturación (una por línea)</label><textarea id="efAud" style="min-height:110px">${E((c.auditoria||[]).join('\n'))}</textarea>
      <label>Nota de asociación de códigos (interna)</label><textarea id="efAsoc">${E(c.asoc_extra||'')}</textarea>
      <div style="margin-top:16px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="minibtn" id="efSave">Guardar cambios</button>
        <button class="minibtn danger" id="efReset">Restaurar original</button>
      </div>`;
    el('aClose').addEventListener('click',closeAdmin);
    el('efSave').addEventListener('click',()=>{
      const trab=el('efTrab').value.trim(),intp=el('efInt').value.trim();
      const aud=el('efAud').value.split('\n').map(s=>s.trim()).filter(Boolean);
      const ov={nombre:el('efNom').value.trim(),norma:(trab||intp)?{trabajo:trab,interpretacion:intp}:null,auditoria:aud,asoc_extra:el('efAsoc').value.trim()||null};
      CONTENT.codes[code]=ov;logEdit('editó ficha',code);persistContent();applyCode(code);
      if(state.view==='list')render();closeAdmin();openCode(code);toast('Ficha actualizada');
    });
    el('efReset').addEventListener('click',()=>{
      if(!confirm('¿Restaurar el contenido original de este código?'))return;
      delete CONTENT.codes[code];logEdit('restauró ficha',code);persistContent();applyCode(code);
      if(state.view==='list')render();closeAdmin();openCode(code);toast('Contenido restaurado');
    });
    amodal.classList.add('on');
  }

  /* ============ ONBOARDING (primer uso) ============ */
  const ICN={
    search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    tabs:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v5"/>',
    star:'<path d="M12 3l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 18l-5.9 3 1.2-6.5L2.5 9.9 9.1 9z"/>',
    money:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1.1 1.1-2 2.5-2s2.5.7 2.5 1.8-1 1.6-2.5 1.9-2.5.8-2.5 2 1.1 1.8 2.5 1.8 2.5-.9 2.5-2"/>',
    check:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'
  };
  function obSteps(){
    const s=[
      {i:'tabs',t:'Tres nomencladores en uno',d:'Cambiá entre <b>Laboratorio (NBU)</b>, <b>Prestaciones médicas (PMO)</b> y <b>Odontología</b> con el selector de arriba. Cada sección muestra solo sus códigos.'},
      {i:'search',t:'Buscá al instante',d:'Escribí un <b>código, práctica, sinónimo o abreviatura</b>. Tocá cualquier resultado para ver la ficha completa con normas, relaciones y valores.'},
      {i:'star',t:'Tus favoritos',d:'Marcá con la <b>estrella</b> los códigos que más usás. Quedan guardados en <b>tu perfil</b>: al iniciar sesión los tenés a mano y podés filtrarlos.'},
      {i:'money',t:'Arancel automático',d:'Cargá el <b>valor de la U.B.</b> arriba y la app calcula el <b>arancel en $</b> en el listado, la ficha y el validador. Usa la U.B. vigente actualizada.'},
      {i:'check',t:'Validador de facturación',d:'Pegá una lista de códigos y detectá <b>doble facturación</b>, urgencias sin 661200, seriados excedidos y más. Ideal para auditar antes de presentar.'}
    ];
    if(current&&current.role==='admin')s.push({i:'edit',t:'Sos administrador',d:'Con el botón <b>✎</b> activás el <b>modo edición</b> para corregir el contenido de cada ficha, y con el <b>engranaje</b> gestionás perfiles, el logo y la sincronización.'});
    return s;
  }
  let obIdx=0,obList=[];
  function maybeOnboard(){try{if(localStorage.getItem('nbu-onboarded'))return;}catch(e){}startOnboard();}
  function startOnboard(){obList=obSteps();obIdx=0;el('onboard').classList.add('on');renderOb();}
  function endOnboard(){el('onboard').classList.remove('on');try{localStorage.setItem('nbu-onboarded','1');}catch(e){}}
  function renderOb(){
    const s=obList[obIdx],last=obIdx===obList.length-1;
    el('onboardCard').innerHTML=`
      <button class="obskip" id="obX" style="position:absolute;top:10px;right:10px">Saltar</button>
      <div class="obicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICN[s.i]}</svg></div>
      <h3>${s.t}</h3><p>${s.d}</p>
      <div class="obdots">${obList.map((_,k)=>`<i class="${k===obIdx?'on':''}"></i>`).join('')}</div>
      <div class="obnav">
        ${obIdx>0?'<button class="obskip" id="obPrev">← Atrás</button>':'<span style="flex:1"></span>'}
        <button class="gbtn" id="obNext">${last?'Empezar a usar':'Siguiente'}</button>
      </div>`;
    el('obX').addEventListener('click',endOnboard);
    el('obNext').addEventListener('click',()=>{if(last)endOnboard();else{obIdx++;renderOb();}});
    if(el('obPrev'))el('obPrev').addEventListener('click',()=>{obIdx--;renderOb();});
  }
  el('onboard').addEventListener('click',e=>{if(e.target===el('onboard'))endOnboard();});

  /* ============ header wiring ============ */
  el('acctChip').addEventListener('click',()=>{if(companyAuthed)renderGate('profiles'),gate.hidden=false;});
  el('adminBtn').addEventListener('click',()=>openAdmin());
  el('editModeBtn').addEventListener('click',()=>{
    editMode=!editMode;document.body.classList.toggle('editmode-on',editMode);
    if(el('drawer').classList.contains('on')&&currentCode)openCode(currentCode);
    toast(editMode?'Modo edición activado — abrí una ficha y tocá “Editar ficha”':'Modo edición desactivado');
  });

  /* ============ API pública para el resto de la app ============ */
  let paT=null;
  function persistAuthSoon(){save(KEY.auth,AUTH);clearTimeout(paT);paT=setTimeout(persistAuth,1200);}
  window.NBUProfile={
    active:()=>current,
    canEdit:()=>!!(current&&current.role==='admin'&&editMode),
    saveFavs:(arr)=>{if(current){current.favs=arr.slice();current.updated=Date.now();persistAuth();}},
    saveUB:(val)=>{if(current){current.ub=val;current.updated=Date.now();persistAuth();}},
    editFicha:editFicha,
    tour:startOnboard,
    recent:()=>current&&current.recent?current.recent:[],
    pushRecent:(code)=>{if(!current)return;const r=current.recent=current.recent||[];const i=r.indexOf(code);if(i>=0)r.splice(i,1);r.unshift(code);if(r.length>30)r.length=30;current.updated=Date.now();persistAuthSoon();},
    getNote:(code)=>current&&current.notes?(current.notes[code]||''):'',
    setNote:(code,txt)=>{if(!current)return;current.notes=current.notes||{};if(txt&&txt.trim())current.notes[code]=txt.trim();else delete current.notes[code];current.updated=Date.now();persistAuthSoon();}
  };

  /* ============ init ============ */
  applyContent();
  if(!AUTH.company){showGate('setup');}
  else{showGate('company');}
  if(SYNC.enabled){initEnc().then(()=>{startPolling();pull();});}
})();
})();
</script>
</body>
</html>
