<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual Inteligente NBU · Códigos Bioquímicos</title>
<style>
:root{
  --bg:#e9eef2; --surface:#ffffff; --surface-2:#f4f7f9; --surface-3:#eef3f6;
  --ink:#132029; --ink-2:#33454f; --muted:#5d6e79; --faint:#8797a1;
  --line:#dae2e8; --line-2:#c8d4db;
  --accent:#0d7a86; --accent-ink:#0a5a63; --accent-soft:#d6ecee;
  --urg:#b3560c; --urg-soft:#fbe7d3;
  --norma:#1c62b0; --norma-soft:#dde9f8;
  --desuso:#6b7681; --desuso-soft:#e6ebef;
  --inc:#15803d; --inc-soft:#d8efdf;
  --exc:#b3261e; --exc-soft:#f8dedb;
  --incd:#6d34c4; --incd-soft:#e7ddf7;
  --new:#0d7a86; --new-soft:#d6ecee;
  --pmo:#0d7a86; --pe:#7a4bd6; --gestion:#8a6d1f;
  --shadow:0 1px 2px rgba(19,32,41,.06),0 8px 28px rgba(19,32,41,.10);
  --radius:11px; --radius-sm:8px;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0c1317; --surface:#141e25; --surface-2:#1a262e; --surface-3:#202e37;
    --ink:#e7eef2; --ink-2:#c3d0d8; --muted:#93a3ad; --faint:#6f818c;
    --line:#26333c; --line-2:#33434d;
    --accent:#2cb6c3; --accent-ink:#8ddbe2; --accent-soft:#123037;
    --urg:#e08a4a; --urg-soft:#3a2413;
    --norma:#6aa8ee; --norma-soft:#132741;
    --desuso:#8a97a1; --desuso-soft:#232e35;
    --inc:#4fbf78; --inc-soft:#123023;
    --exc:#e9736a; --exc-soft:#3a1a18;
    --incd:#a985ea; --incd-soft:#241634;
    --new:#2cb6c3; --new-soft:#123037;
    --pmo:#2cb6c3; --pe:#a985ea; --gestion:#d3ad55;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 34px rgba(0,0,0,.44);
  }
}
:root[data-theme="light"]{
  --bg:#e9eef2; --surface:#ffffff; --surface-2:#f4f7f9; --surface-3:#eef3f6;
  --ink:#132029; --ink-2:#33454f; --muted:#5d6e79; --faint:#8797a1;
  --line:#dae2e8; --line-2:#c8d4db;
  --accent:#0d7a86; --accent-ink:#0a5a63; --accent-soft:#d6ecee;
  --urg:#b3560c; --urg-soft:#fbe7d3; --norma:#1c62b0; --norma-soft:#dde9f8;
  --desuso:#6b7681; --desuso-soft:#e6ebef; --inc:#15803d; --inc-soft:#d8efdf;
  --exc:#b3261e; --exc-soft:#f8dedb; --incd:#6d34c4; --incd-soft:#e7ddf7;
  --new:#0d7a86; --new-soft:#d6ecee; --pmo:#0d7a86; --pe:#7a4bd6; --gestion:#8a6d1f;
  --shadow:0 1px 2px rgba(19,32,41,.06),0 8px 28px rgba(19,32,41,.10);
}
:root[data-theme="dark"]{
  --bg:#0c1317; --surface:#141e25; --surface-2:#1a262e; --surface-3:#202e37;
  --ink:#e7eef2; --ink-2:#c3d0d8; --muted:#93a3ad; --faint:#6f818c;
  --line:#26333c; --line-2:#33434d;
  --accent:#2cb6c3; --accent-ink:#8ddbe2; --accent-soft:#123037;
  --urg:#e08a4a; --urg-soft:#3a2413; --norma:#6aa8ee; --norma-soft:#132741;
  --desuso:#8a97a1; --desuso-soft:#232e35; --inc:#4fbf78; --inc-soft:#123023;
  --exc:#e9736a; --exc-soft:#3a1a18; --incd:#a985ea; --incd-soft:#241634;
  --new:#2cb6c3; --new-soft:#123037; --pmo:#2cb6c3; --pe:#a985ea; --gestion:#d3ad55;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 34px rgba(0,0,0,.44);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
/* --- selector de sección principal (modo) --- */
.modeswitch{display:flex;gap:10px;max-width:1500px;margin:0 auto;padding:0 20px 12px}
.modebtn{flex:1;display:flex;align-items:center;gap:11px;padding:11px 16px;border-radius:12px;border:1.5px solid var(--line-2);
  background:var(--surface-2);color:var(--muted);transition:.14s;text-align:left}
.modebtn svg{flex-shrink:0;opacity:.8}
.modebtn span{display:flex;flex-direction:column;line-height:1.2}
.modebtn b{font-size:14.5px;font-weight:700;color:var(--ink-2)}
.modebtn small{font-size:11.5px;color:var(--faint);letter-spacing:.2px}
.modebtn:hover{border-color:var(--line-2);background:var(--surface-3)}
.modebtn.on[data-mode="NBU"]{border-color:var(--pmo);background:var(--accent-soft)}
.modebtn.on[data-mode="PMO"]{border-color:var(--med);background:color-mix(in srgb,var(--med) 12%,transparent)}
.modebtn.on[data-mode="ODO"]{border-color:var(--odo);background:color-mix(in srgb,var(--odo) 13%,transparent)}
.modebtn.on[data-mode="UNICO"]{border-color:var(--unico);background:color-mix(in srgb,var(--unico) 13%,transparent)}
.modebtn.on b{color:var(--ink)} .modebtn.on svg{opacity:1}
.modebtn.on[data-mode="NBU"] svg,.modebtn.on[data-mode="NBU"] small{color:var(--accent-ink)}
.modebtn.on[data-mode="PMO"] svg,.modebtn.on[data-mode="PMO"] small{color:var(--med)}
.modebtn.on[data-mode="ODO"] svg,.modebtn.on[data-mode="ODO"] small{color:var(--odo)}
.modebtn.on[data-mode="UNICO"] svg,.modebtn.on[data-mode="UNICO"] small{color:var(--unico)}
.modebtn.on[data-mode="CIE"]{border-color:var(--cie);background:color-mix(in srgb,var(--cie) 13%,transparent)}
.modebtn.on[data-mode="CIE"] svg,.modebtn.on[data-mode="CIE"] small{color:var(--cie)}
@media (max-width:560px){.modebtn small{display:none}.modebtn{padding:9px 12px}}
/* --- nomenclador PMO médico color --- */
:root{--med:#0369a1}
@media (prefers-color-scheme:dark){:root{--med:#38bdf8}}
:root[data-theme="light"]{--med:#0369a1}
:root[data-theme="dark"]{--med:#38bdf8}
.b-med{background:color-mix(in srgb,var(--med) 16%,transparent);color:var(--med)}
.t-med{background:color-mix(in srgb,var(--med) 16%,transparent);color:var(--med);font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px}
:root{--odo:#0f766e}@media (prefers-color-scheme:dark){:root{--odo:#2dd4bf}}
:root[data-theme="light"]{--odo:#0f766e}:root[data-theme="dark"]{--odo:#2dd4bf}
.b-odo{background:color-mix(in srgb,var(--odo) 16%,transparent);color:var(--odo)}
:root{--unico:#9333ea}@media (prefers-color-scheme:dark){:root{--unico:#c084fc}}
:root[data-theme="light"]{--unico:#9333ea}:root[data-theme="dark"]{--unico:#c084fc}
.b-unico{background:color-mix(in srgb,var(--unico) 16%,transparent);color:var(--unico)}
:root{--cie:#b45309}@media (prefers-color-scheme:dark){:root{--cie:#fbbf24}}
:root[data-theme="light"]{--cie:#b45309}:root[data-theme="dark"]{--cie:#fbbf24}
.b-cie{background:color-mix(in srgb,var(--cie) 16%,transparent);color:var(--cie)}
.cie-rel{background:color-mix(in srgb,var(--cie) 8%,transparent);border:1px solid color-mix(in srgb,var(--cie) 26%,transparent);border-radius:var(--radius-sm);padding:12px 14px}
.cie-rel .cr-lbl{font-weight:800;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 7px}
.cie-chip{display:inline-flex;flex-direction:column;gap:1px;text-align:left;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:7px 10px;cursor:pointer;margin:0 6px 6px 0;max-width:100%}
.cie-chip:hover{border-color:var(--cie);background:color-mix(in srgb,var(--cie) 7%,transparent)}
.cie-chip b{font-family:var(--font-mono);font-size:12px;color:var(--accent-ink)}
.cie-chip small{font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.disc-tab{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.disc-tab td{padding:5px 8px;border-top:1px solid var(--line)}
.disc-tab td:last-child{text-align:right;font-family:var(--font-mono);font-weight:700;color:var(--accent-ink);white-space:nowrap}
.t-unico{background:color-mix(in srgb,var(--unico) 16%,transparent);color:var(--unico);font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px}
.t-noeq{background:var(--urg-soft);color:var(--urg);font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px}
.equiv-card{background:color-mix(in srgb,var(--unico) 8%,transparent);border:1px solid color-mix(in srgb,var(--unico) 26%,transparent);border-radius:var(--radius-sm);padding:12px 14px}
.equiv-card .eqrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.equiv-card .eqcode{font-family:var(--font-mono);font-weight:700;color:var(--unico);cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.equiv-card .eqscore{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--surface-3);color:var(--muted)}
/* --- feature add-ons: valor U.B., favoritos, arancel, seriado, export, print --- */
.ubctl{gap:5px!important}
.ubctl .ubsign{color:var(--faint);font-weight:700}
.ubctl input{width:64px;border:none;background:none;color:var(--ink);font-family:var(--font-mono);font-weight:700;
  font-size:13.5px;outline:none;padding:0;-moz-appearance:textfield}
.ubctl input::-webkit-outer-spin-button,.ubctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ubctl{border-color:var(--accent)!important;background:var(--accent-soft)!important;color:var(--accent-ink)!important}
.ubclr{cursor:pointer;color:var(--faint);font-weight:700;font-size:15px;line-height:1}
.ubclr:hover{color:var(--exc)}
.row{grid-template-columns:22px 78px 1fr auto!important}
@media (max-width:560px){.row{grid-template-columns:20px 62px 1fr auto!important;gap:8px!important}}
.star{cursor:pointer;font-size:16px;line-height:1;color:var(--faint);transition:.12s;user-select:none;justify-self:center}
.star:hover{color:var(--gestion);transform:scale(1.18)}
.star.on{color:var(--gestion)}
.aran{color:var(--accent-ink)!important;font-weight:700!important}
.tag.t-freq{background:var(--norma-soft);color:var(--norma)}
.exportbtns{display:flex;gap:7px}
.xbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);transition:.13s}
.xbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--surface-2)}
.dstar{cursor:pointer;font-size:24px;line-height:1;color:var(--faint);transition:.12s;user-select:none}
.dstar:hover{transform:scale(1.12)} .dstar.on{color:var(--gestion)}
.freq-note{font-size:13px;color:var(--ink-2);background:var(--norma-soft);border:1px solid color-mix(in srgb,var(--norma) 26%,transparent);
  border-radius:10px;padding:11px 14px;line-height:1.5}
.freq-note .seriado-b{display:inline-block;font-weight:700;color:var(--norma);margin-bottom:3px}
.vqty{font-family:var(--font-mono);font-weight:700;color:var(--accent-ink);font-size:12.5px;min-width:34px;text-align:center}
.vtable .vtrow{grid-template-columns:72px 1fr 46px 74px auto!important}
@media (max-width:560px){.vtable .vtrow{grid-template-columns:60px 1fr 38px auto!important}}
@media print{
  header,aside,.viewtabs,.exportbtns,.vinput,#moreBtn,.scrim,.drawer,.modal,.star,.hbtns,.filter-toggle{display:none!important}
  .wrap{display:block;padding:0;max-width:100%}
  body{background:#fff;color:#000;font-size:11px}
  .row,.vtrow,.finding,.vstat{break-inside:avoid;box-shadow:none!important;border-color:#ccc!important}
  main{width:100%}
  .print-head{display:block!important}
}
.print-head{display:none;margin-bottom:12px}
.print-head h2{margin:0;font-size:16px}
.print-head p{margin:2px 0 0;font-size:11px;color:#555}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-ui);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--accent-soft)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:30; background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line);
}
.hbar{display:flex;align-items:center;gap:16px;padding:12px 20px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.logo{min-width:38px;height:38px;border-radius:10px;flex-shrink:0;padding:0 12px;white-space:nowrap;
  background:linear-gradient(150deg,var(--accent),var(--accent-ink));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12.5px;letter-spacing:.6px;
  box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent)}
.logo.hasimg{padding:2px;background:#fff;width:auto}
.logo.hasimg img{height:34px;width:auto;max-width:160px;object-fit:contain;display:block}
.gcard .glogo.brand{width:auto;padding:0 16px;font-size:16px;letter-spacing:.8px}
.gcard .glogo.brand.hasimg{background:#fff;padding:6px}
.gcard .glogo.brand img{height:38px;width:auto;max-width:190px;object-fit:contain;display:block}
.brand h1{font-size:15px;font-weight:700;margin:0;letter-spacing:-.2px;line-height:1.15}
.brand p{font-size:11.5px;margin:0;color:var(--muted);letter-spacing:.2px}
.search{position:relative;flex:1;max-width:620px;margin:0 auto}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
#q{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--surface-2);color:var(--ink);font-size:14.5px;outline:none;transition:.15s}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.hbtns{display:flex;gap:8px;flex-shrink:0}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);
  color:var(--ink-2);display:grid;place-items:center;transition:.15s}
.icon-btn:hover{background:var(--surface-3);border-color:var(--line-2);color:var(--accent)}
.stats{display:flex;gap:10px;padding:0 20px 12px;max-width:1500px;margin:0 auto;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:7px;padding:5px 12px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted)}
.stat b{font-family:var(--font-mono);font-size:13.5px;color:var(--ink);font-weight:700}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:264px 1fr;gap:20px;max-width:1500px;margin:0 auto;padding:18px 20px 60px;align-items:start}
aside{position:sticky;top:128px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 148px);overflow-y:auto;padding-right:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel h2{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);
  margin:0;padding:13px 15px 9px;font-weight:700}
.fgroup{padding:0 11px 12px;display:flex;flex-direction:column;gap:3px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;
  font-size:13.5px;color:var(--ink-2);cursor:pointer;border:1px solid transparent;transition:.12s;text-align:left;width:100%;background:none}
.opt:hover{background:var(--surface-2)}
.opt.on{background:var(--accent-soft);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 32%,transparent);font-weight:600}
.opt .n{font-family:var(--font-mono);font-size:11.5px;color:var(--faint)}
.opt.on .n{color:var(--accent-ink)}
.seccol{width:8px;height:8px;border-radius:2px;flex-shrink:0;margin-right:2px}
.optrow{display:flex;align-items:center;gap:0;flex:1;min-width:0}
.optrow span.lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clearf{margin:0 11px 12px;font-size:12.5px;color:var(--accent);background:none;border:1px solid var(--line-2);
  border-radius:8px;padding:7px;width:calc(100% - 22px);transition:.12s}
.clearf:hover{background:var(--surface-2)}

/* ---------- results ---------- */
.resbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.resbar .count{font-size:13.5px;color:var(--muted)}
.resbar .count b{color:var(--ink);font-weight:700}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent-ink);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.fchip button{background:none;border:none;color:inherit;font-size:14px;line-height:1;padding:0;opacity:.7}
.fchip button:hover{opacity:1}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:78px 1fr auto;gap:14px;align-items:center;padding:12px 16px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;
  transition:border-color .13s,transform .13s,box-shadow .13s;text-align:left;width:100%;font-family:inherit}
.row:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rcode{font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--accent-ink);letter-spacing:-.3px}
.rmid{min-width:0}
.rname{font-size:14px;color:var(--ink);font-weight:600;line-height:1.3;margin-bottom:3px}
.rmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.b-pmo{background:var(--accent-soft);color:var(--accent-ink)}
.b-pe{background:var(--incd-soft);color:var(--incd)}
.b-gestion{background:#efe4c4;color:var(--gestion)}
:root[data-theme="dark"] .b-gestion{background:#2e2811}
.rgrupo{font-size:12px;color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:.3px}
.t-urg{background:var(--urg-soft);color:var(--urg)}
.t-norma{background:var(--norma-soft);color:var(--norma)}
.t-desuso{background:var(--desuso-soft);color:var(--desuso)}
.t-rel{background:var(--inc-soft);color:var(--inc)}
.t-new{background:var(--new-soft);color:var(--new)}
.rright{text-align:right;flex-shrink:0}
.rub{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;color:var(--ink)}
.rub small{font-size:10px;color:var(--faint);font-weight:600;display:block;letter-spacing:.4px;margin-top:1px}
.rub.na{color:var(--faint);font-weight:600;font-size:13px}
.more{margin:16px auto 0;display:block;padding:10px 22px;border:1px solid var(--line-2);background:var(--surface);
  border-radius:9px;color:var(--accent);font-weight:600;font-size:13.5px}
.more:hover{background:var(--surface-2)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,18,24,.5);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(580px,100%);background:var(--surface);z-index:50;
  box-shadow:-8px 0 40px rgba(10,18,24,.28);transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.on{transform:translateX(0)}
.dhead{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px}
.dhead .x{margin-left:auto;flex-shrink:0}
.dcode{font-family:var(--font-mono);font-size:22px;font-weight:800;color:var(--accent-ink);letter-spacing:-.5px;line-height:1}
.dname{font-size:18px;font-weight:700;line-height:1.28;margin:9px 0 12px;text-wrap:balance}

.acode{font-family:var(--font-mono);font-size:11.5px;background:var(--surface-3);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap;word-break:break-word;color:var(--ink-2);max-height:200px;overflow:auto}
.aok{color:var(--inc);font-weight:700;font-size:12.5px}.aerrt{color:var(--exc);font-weight:700;font-size:12.5px}
.editbar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius-sm);margin-bottom:12px;font-size:12.5px;color:var(--accent-ink);font-weight:600}
.editbar button{margin-left:auto}
.ovr-badge{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--new);background:var(--new-soft);padding:2px 6px;border-radius:12px;margin-left:6px;vertical-align:middle}
.dedit{margin-top:6px}
.dedit .minibtn{width:100%;padding:8px}
mark.hl{background:var(--accent-soft);color:var(--accent-ink);border-radius:3px;padding:0 1px;font-weight:700}
.row.kbfocus{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--radius-sm)}
.dactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.dactions .minibtn{flex:0 0 auto}
.dnote{margin-top:6px}
.dnote textarea{width:100%;min-height:56px;resize:vertical;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--ink);font:inherit;font-size:13px;padding:8px 10px;line-height:1.5}
.dnote textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.kbd{display:inline-block;min-width:16px;text-align:center;font-family:var(--font-mono);font-size:11px;background:var(--surface-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink-2)}
/* onboarding */
#onboard{position:fixed;inset:0;z-index:1100;background:rgba(19,32,41,.55);display:none;align-items:center;justify-content:center;padding:22px}
#onboard.on{display:flex}
.obcard{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;text-align:center;position:relative}
.obicon{width:64px;height:64px;border-radius:16px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.obicon svg{width:32px;height:32px}
.obcard h3{font-size:20px;margin:0 0 8px;color:var(--ink)}
.obcard p{font-size:14px;line-height:1.55;color:var(--ink-2);margin:0 auto;max-width:340px}
.obdots{display:flex;gap:7px;justify-content:center;margin:20px 0 18px}
.obdots i{width:8px;height:8px;border-radius:50%;background:var(--line-2);transition:.2s}
.obdots i.on{background:var(--accent);width:22px;border-radius:6px}
.obnav{display:flex;gap:10px;align-items:center;justify-content:space-between}
.obnav .gbtn{margin-top:0;flex:1}
.obskip{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:8px}
.obskip:hover{color:var(--ink)}
</style>
</head>

<script>
(async()=>{
async function loadDB(){
  const gz=document.getElementById('nbu-db-gz');
  if(gz){
    try{
      const bin=Uint8Array.from(atob(gz.textContent.trim()),c=>c.charCodeAt(0));
      const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
      return JSON.parse(await new Response(stream).text());
    }catch(e){
      const bt=document.getElementById('boot');
      if(bt)bt.innerHTML='<div style="padding:40px;max-width:420px;text-align:center;font:15px system-ui;color:#b3261e;line-height:1.5">No se pudo cargar la base de datos.<br>Usá un navegador actualizado (Chrome, Edge, Firefox o Safari recientes).</div>';
      throw e;
    }
  }
  return JSON.parse(document.getElementById('nbu-db').textContent);
}
const DB = await loadDB();
const _boot=document.getElementById('boot'); if(_boot)_boot.remove();
Object.entries(DB.codigos).forEach(([k,v])=>{v._key=k;});
const CODES = Object.values(DB.codigos).sort((a,b)=>a.code.localeCompare(b.code));
const BYCODE = DB.codigos;
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
// precompute search haystack
CODES.forEach(c=>{ c._h = norm([c.code,c._key,c.nombre,...(c.sinonimos||[]),...(c.abreviaturas||[])].join(' ')); });

const SEC_LABEL={PMO:'PMO',PE:'Prácticas Especiales',GESTION:'Gestión Adm.',PMO_MED:'Catálogo PMO',ODO:'Odontología',UNICO:'Único'};
const SEC_CLASS={PMO:'b-pmo',PE:'b-pe',GESTION:'b-gestion',PMO_MED:'b-med',ODO:'b-odo',UNICO:'b-unico'};
const SEC_COLORVAR={PMO:'var(--pmo)',PE:'var(--pe)',GESTION:'var(--gestion)',PMO_MED:'var(--med)',ODO:'var(--odo)',UNICO:'var(--unico)'};
const NOMEN_LABEL={NBU:'NBU · bioquímica',PMO:'PMO · prestaciones médicas',ODO:'Odontología',UNICO:'Nomenclador Único (VISITAR)',CIE:'Diagnósticos CIE-10'};
// CIE-10 (diagnósticos)
const CIE=(DB.cie10&&DB.cie10.codigos)?DB.cie10.codigos:{};
const CIE_LIST=Object.values(CIE);
CIE_LIST.forEach(d=>{d._h=norm(d.code+' '+d.desc+' '+(d.cap_nombre||''));});
const CIE_CAPS=(DB.cie10&&DB.cie10.capitulos)?DB.cie10.capitulos:[];
const CIE_REL=(DB.cie10&&DB.cie10.relaciones)?DB.cie10.relaciones:{};
const LEYES_BY_NUM={};(DB.leyes||[]).forEach(l=>{LEYES_BY_NUM[l.ley]=l;});
const STOP=new Set('otras otros otro no del las los una uno con por para sin sobre entre como sus que especificado especificados especificada no clasificado clasificados clasificada parte debido debida enfermedad enfermedades trastorno trastornos afeccion afecciones sitio efectos efecto forma formas tipo tipos otra'.split(' '));
function cieSuggest(d){
  const toks=[...new Set(norm(d.desc).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>4&&!STOP.has(w)))];
  if(!toks.length)return [];
  const cur=new Set(CIE_REL[d.code]||[]);
  const scored=[];
  for(const c of CODES){
    if(c.nomenclador!=='NBU'&&c.nomenclador!=='PMO')continue;
    if(cur.has(c.code))continue;
    let n=0;for(const t of toks)if(c._h.includes(t))n++;
    if(n)scored.push([n,c]);
  }
  scored.sort((a,b)=>b[0]-a[0]);
  return scored.slice(0,6).map(x=>x[1]._key);
}

let savedMode='NBU';try{savedMode=localStorage.getItem('nbu-mode')||'NBU';}catch(e){}
const state={q:'',mode:savedMode,seccion:new Set(),grupo:new Set(),flags:new Set(),limit:80,view:'list'};
const el=id=>document.getElementById(id);

/* ---------- ajustes globales: valor U.B. + favoritos ---------- */
let ubValue=parseFloat(localStorage.getItem('nbu-ub-value'))||0;
const FAVS=new Set();
function saveFavs(){
  if(window.NBUProfile&&NBUProfile.active()){NBUProfile.saveFavs([...FAVS]);return;}
  try{localStorage.setItem('nbu-favs',JSON.stringify([...FAVS]));}catch(e){}
}
function toggleFav(code){if(FAVS.has(code))FAVS.delete(code);else FAVS.add(code);saveFavs();}
function fmtMoney(n){return '$'+Number(n).toLocaleString('es-AR',{maximumFractionDigits:2});}
function getUB(c){if(!c||!c.valor)return null;return c.valor.ub_vigente!=null?c.valor.ub_vigente:c.valor.ub;}
function aranStr(ub){return (ubValue>0&&ub!=null)?fmtMoney(ub*ubValue):'';}
function starBtn(code){return `<span class="star${FAVS.has(code)?' on':''}" data-fav="${code}" role="button" aria-label="Favorito" title="Marcar favorito">${FAVS.has(code)?'★':'☆'}</span>`;}

/* ---------- stats + control de valor U.B. ---------- */
function refreshStats(){
  const nc=DB.meta.nomenclador_counts||{};
  const pills=[
    ['Códigos',CODES.length],['NBU',nc.NBU||0],['PMO méd.',nc.PMO||0],['Odont.',nc.ODO||0],['Único',nc.UNICO||0],['CIE-10',CIE_LIST.length],
    ['★ Fav.',FAVS.size]
  ].map(([k,v])=>`<span class="stat">${k} <b>${v.toLocaleString('es-AR')}</b></span>`).join('');
  el('stats').innerHTML=
    `<span class="stat ubctl">Valor U.B. <span class="ubsign">$</span><input id="ubv" type="number" min="0" step="0.01" placeholder="—" value="${ubValue||''}"><span class="ubclr" id="ubclr" title="Borrar" hidden>×</span></span>`+pills;
  const inp=el('ubv');
  el('ubclr').hidden=!(ubValue>0);
  inp.addEventListener('input',()=>{
    ubValue=parseFloat(inp.value)||0;
    if(window.NBUProfile&&NBUProfile.active()){NBUProfile.saveUB(ubValue>0?ubValue:null);}
    else{try{ubValue>0?localStorage.setItem('nbu-ub-value',ubValue):localStorage.removeItem('nbu-ub-value');}catch(e){}}
    el('ubclr').hidden=!(ubValue>0);
    if(state.view==='list')render(); else if(state.view==='validator'&&el('vresults')&&el('vresults').innerHTML)runValidator();
    if(el('drawer').classList.contains('on')&&currentCode)openCode(currentCode);
  });
  el('ubclr').addEventListener('click',()=>{inp.value='';inp.dispatchEvent(new Event('input'));});
}
refreshStats();

/* ---------- filters build ---------- */
function countBy(fn,pred){const m={};CODES.forEach(c=>{if(pred&&!pred(c))return;const k=fn(c);if(k)m[k]=(m[k]||0)+1});return m;}
const secCounts=countBy(c=>c.seccion);
el('fSeccion').innerHTML=['PMO','PE','GESTION'].map(s=>
  `<button class="opt" data-f="seccion" data-v="${s}"><span class="optrow"><span class="seccol" style="background:${SEC_COLORVAR[s]}"></span><span class="lbl">${SEC_LABEL[s]}</span></span><span class="n">${secCounts[s]||0}</span></button>`).join('');
// grupos por modo (para no mezclar bioquímica con especialidades médicas)
function buildGroups(){
  let grupos;
  if(state.mode==='CIE'){
    const cnt={};CIE_LIST.forEach(d=>{cnt[d.cap]=(cnt[d.cap]||0)+1;});
    grupos=CIE_CAPS.map(cp=>[cp.rom,cnt[cp.rom]||0,cp.rom+' · '+cp.nombre]).filter(g=>g[1]);
  }else{
    const counts=countBy(c=>c.grupo,c=>c.nomenclador===state.mode);
    grupos=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([g,n])=>[g,n,g]);
  }
  el('fGrupo').innerHTML=grupos.map(([g,n,lbl])=>
    `<button class="opt${state.grupo.has(g)?' on':''}" data-f="grupo" data-v="${String(g).replace(/"/g,'&quot;')}"><span class="optrow"><span class="lbl">${esc(lbl)}</span></span><span class="n">${n}</span></button>`).join('');
  el('fGrupo').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>toggleOpt(b)));
}
const FLAGS=[['fav','★ Favoritos'],['recientes','Vistos recientemente'],['nota','Con nota personal'],['sin_equiv','⚠ Sin equivalencia (Único)'],['con_equiv','Con equivalencia (Único)'],['valores','Con valores validados'],['urgencia','Urgencia (U)'],['requiere_norma','Requiere norma (N)'],['con_rel','Con relaciones'],['seriado','Con frecuencia/seriado'],['desuso','En desuso (#)'],['pcr','Metodología PCR'],['new2024','Actualizado 2024']];
el('fFlags').innerHTML=FLAGS.map(([k,l])=>`<button class="opt" data-f="flags" data-v="${k}"><span class="optrow"><span class="lbl">${l}</span></span></button>`).join('');

function toggleOpt(b){
  const f=b.dataset.f,v=b.dataset.v,set=state[f];
  if(set.has(v)){set.delete(v);b.classList.remove('on');}else{set.add(v);b.classList.add('on');}
  state.limit=80; render();
}
document.querySelectorAll('#fSeccion .opt, #fFlags .opt').forEach(b=>b.addEventListener('click',()=>toggleOpt(b)));

/* ---------- selector de sección principal (modo) ---------- */
function setMode(m){
  if(m===state.mode)return;
  state.mode=m; state.seccion.clear(); state.grupo.clear(); state.limit=80;
  try{localStorage.setItem('nbu-mode',m);}catch(e){}
  applyMode();
  render();
}
function applyMode(){
  document.querySelectorAll('.modebtn').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.mode));
  el('secPanel').hidden = state.mode!=='NBU';        // "Sección NBU" solo aplica a laboratorio
  el('grupoTitle').textContent = state.mode==='NBU' ? 'Grupo · área bioquímica' : (state.mode==='CIE' ? 'Capítulo CIE-10' : 'Capítulo · especialidad');
  const treeOK = state.mode==='NBU'||state.mode==='UNICO'; // árbol de módulos: NBU y Único (lab)
  document.querySelector('.vtab[data-view="tree"]').hidden = !treeOK;
  if(!treeOK&&state.view==='tree')state.view='list';
  document.querySelector('.vtab[data-view="validator"]').hidden = state.mode==='CIE'; // el validador no aplica a diagnósticos
  if(state.mode==='CIE'&&state.view==='validator')state.view='list';
  // limpiar chips de sección/grupo que no correspondan al modo

  buildGroups();
}

/* ---------- filtering ---------- */
function hasRel(c){return c.relaciones&&(c.relaciones.incluye.length||c.relaciones.no_incluye.length||c.relaciones.incluido_en.length);}
function passFlags(c){
  for(const f of state.flags){
    if(f==='urgencia'&&!c.flags.urgencia)return false;
    if(f==='requiere_norma'&&!c.flags.requiere_norma)return false;
    if(f==='desuso'&&!c.flags.desuso)return false;
    if(f==='pcr'&&!c.flags.pcr)return false;
    if(f==='con_rel'&&!hasRel(c))return false;
    if(f==='new2024'&&c.valor.ub_actualizado_2024==null)return false;
    if(f==='fav'&&!FAVS.has(c.code))return false;
    if(f==='recientes'&&!(window.NBUProfile&&NBUProfile.recent&&NBUProfile.recent().includes(c._key)))return false;
    if(f==='nota'&&!(window.NBUProfile&&NBUProfile.getNote&&NBUProfile.getNote(c._key)))return false;
    if(f==='seriado'&&!((c.frecuencia&&c.frecuencia.length)||c.seriado))return false;
    if(f==='valores'&&!c.valores)return false;
    if(f==='sin_equiv'&&!(c.nomenclador==='UNICO'&&c.sin_equivalencia))return false;
    if(f==='con_equiv'&&!(c.nomenclador==='UNICO'&&c.equivalencia&&!c.sin_equivalencia))return false;
  }
  return true;
}
function filtered(){
  const q=norm(state.q);
  const terms=q.split(/\s+/).filter(Boolean);
  return CODES.filter(c=>{
    if(c.nomenclador!==state.mode)return false;
    if(state.seccion.size&&!state.seccion.has(c.seccion))return false;
    if(state.grupo.size&&!state.grupo.has(c.grupo))return false;
    if(state.flags.size&&!passFlags(c))return false;
    if(terms.length&&!terms.every(tm=>c._h.includes(tm)))return false;
    return true;
  });
}

function ubDisplay(c){

  }
  if(c.nomenclador==='UNICO'&&getUB(c)==null){
    if(c.sin_equivalencia)return `<div class="rub na" style="color:var(--urg)">sin equiv.<br><small style="color:var(--faint)">pendiente</small></div>`;
    const e=c.equivalencia;return `<div class="rub na" style="color:var(--unico)">≡ ${e?e.code:''}<br><small style="color:var(--faint)">${e?esc(e.target_label):''}</small></div>`;

function rowHTML(c){

function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function hlList(s){
  let out=esc(s);

  terms.forEach(t=>{const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');out=out.replace(re,'<mark class="hl">$1</mark>');});
  return out;
}

  const shown=res.slice(0,state.limit);

      <div class="kv" style="margin-top:8px;color:var(--muted);font-size:12.5px">${esc(d.cap_nombre||'')}${par?` · Categoría <span class="mono" data-cie2="${par}" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted">${par}</span> ${esc(CIE[par].desc)}`:''}</div>

/* ---------- exportar CSV / imprimir ---------- */
function downloadCSV(filename,rows){
  const csv=rows.map(r=>r.map(cell=>{let s=(cell==null?'':String(cell));return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(';')).join('\r\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function activeFilterText(){

  if(state.flags.size)p.push([...state.flags].map(f=>(FLAGS.find(x=>x[0]===f)||[f,f])[1]).join(', '));
  return p.length?' · Filtros: '+p.join(' · '):'';
}

/* ---------- module tree ---------- */
const INCLUDED=new Set();CODES.forEach(c=>c.relaciones.incluye.forEach(x=>INCLUDED.add(x)));
function isModule(c){return c&&c.relaciones&&c.relaciones.incluye.length>0;}
function subtreeMatches(key,terms,seen){
  const c=BYCODE[key];if(!c||seen.has(key))return false;seen.add(key);
  if(terms.every(t=>c._h.includes(t)))return true;
  return c.relaciones.incluye.some(x=>subtreeMatches(x,terms,seen));
}
function treeNodeHTML(key,ancestry){
  const c=BYCODE[key];
  if(!c)return `<div class="tnode leaf"><div class="trow"><span class="tdot"></span><span class="tcode">${key}</span><span class="tname" style="color:var(--faint)">(código externo)</span></div></div>`;
  const inc=c.relaciones.incluye.filter(x=>!ancestry.has(x));
  const mod=inc.length>0;
  const secCls={PMO:'b-pmo',PE:'b-pe',GESTION:'b-gestion',UNICO:'b-unico'}[c.seccion]||'b-pmo';
  const _ubv=getUB(c);const ub=_ubv!=null?`${_ubv} UB`:'—';
  const children=mod?`<div class="tchildren">${inc.map(x=>treeNodeHTML(x,new Set([...ancestry,key]))).join('')}</div>`:'';
  return `<div class="tnode ${mod?'mod':'leaf'}">
    <div class="trow">
      ${mod?`<button class="tcaret" aria-label="Expandir/plegar">▸</button>`:`<span class="tdot"></span>`}
      <span class="tcode" data-code="${key}">${c.code}</span>
      <span class="tname" data-code="${key}" title="${esc(c.nombre)}">${esc(c.nombre)}</span>
      ${mod?`<span class="tcount">incluye ${inc.length}</span>`:''}
      <span class="tsec ${secCls}">${c.seccion}</span>
      <span class="tub">${ub}</span>
    </div>${children}
  </div>`;
}
function renderTree(){
  const secOK=c=>!state.seccion.size||state.seccion.has(c.seccion);
  const terms=norm(state.q).split(/\s+/).filter(Boolean);
  let roots=CODES.filter(c=>c.nomenclador===state.mode&&isModule(c)&&!INCLUDED.has(c._key)&&secOK(c));
  if(terms.length)roots=roots.filter(r=>subtreeMatches(r._key,terms,new Set()));
  roots.sort((a,b)=>b.relaciones.incluye.length-a.relaciones.incluye.length||a.code.localeCompare(b.code));
  const totalMods=CODES.filter(c=>c.nomenclador===state.mode&&isModule(c)).length;
  const nomLbl=state.mode==='UNICO'?'el Nomenclador Único':'el NBU';
  el('count').innerHTML=`<b>${roots.length.toLocaleString('es-AR')}</b> módulo${roots.length!==1?'s':''} de facturación de primer nivel`;
  const intro=`<div class="tree-intro"><b>Árbol de módulos.</b> Un <b>módulo</b> agrupa prácticas que <b>no deben facturarse por separado</b>: ya están comprendidas en el código padre. Expandí cada nodo (▸) para ver qué incluye; si un hijo es a su vez un módulo, se puede seguir abriendo. Click en el código o el nombre para abrir la ficha completa. <span style="color:var(--faint)">Total de módulos en ${nomLbl}: ${totalMods}.</span></div>`;
  if(!roots.length){el('tree').innerHTML=intro+`<div class="empty"><b>Sin módulos</b>Ajustá la búsqueda o la sección.</div>`;return;}
  el('tree').innerHTML=intro+roots.map(r=>treeNodeHTML(r._key,new Set([r._key]))).join('');
}

let validatorInit=false;
function initValidator(){

  el('validator').innerHTML=`

        <button class="vbtn ghost" id="vclear">Limpiar</button>
        <button class="vbtn" id="vrun">Validar facturación</button>
      </div>
      <div class="vhint">Detecta doble facturación por inclusión en módulos, urgencias sin 661200, Acto Bioquímico faltante, seriados excedidos, prácticas en desuso y códigos inexistentes. Podés indicar cantidades con <b>×N</b> (ej. <span class="mono">660102 x3</span>). Reglas según el Anexo de Normas del NBU.</div>
    </div>
    <div id="vresults"></div>`;
  el('vrun').addEventListener('click',runValidator);
  el('vclear').addEventListener('click',()=>{el('vcodes').value='';el('vub').value='';el('vresults').innerHTML='';});
  el('vcodes').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')runValidator();});
  el('vresults').addEventListener('click',e=>{const g=e.target.closest('[data-code]');if(g&&BYCODE[g.dataset.code])openCode(g.dataset.code);});
}
let lastVal=null;
function runValidator(){
  const raw=el('vcodes').value;
  const rx=/\b(\d{6})\b(?:\s*[x×*]\s*(\d+))?/g;
  const qty={},uniq=[]; let m;
  while((m=rx.exec(raw))){const code=m[1];const q=Math.max(1,parseInt(m[2]||'1',10)||1);if(!(code in qty))uniq.push(code);qty[code]=(qty[code]||0)+q;}
  const ubVal=parseFloat(el('vub').value)||ubValue||0;
  if(!uniq.length){el('vresults').innerHTML=`<div class="finding info"><div class="ficon">i</div><div class="fbody">Ingresá al menos un código de 6 dígitos. Podés indicar cantidad con <b>×N</b> (ej: <span class="mono">660102 x3</span>).</div></div>`;return;}
  const billed=new Set(uniq.filter(c=>BYCODE[c]));
  const unknown=uniq.filter(c=>!BYCODE[c]);
  const findings=[];
  const nm=c=>BYCODE[c]?BYCODE[c].nombre:'';
  const link=c=>`<span class="mono" data-code="${c}">${c}</span>`;
  // 1. doble facturación por inclusión
  const redundant=new Set();
  billed.forEach(c=>{
    (BYCODE[c].relaciones.incluido_en||[]).forEach(par=>{
      if(billed.has(par)){
        redundant.add(c);
        findings.push({sev:'rechazo',msg:`${link(c)} <b>${esc(nm(c))}</b> ya está incluido en el módulo ${link(par)} <b>${esc(nm(par))}</b>. No debe facturarse por separado.`});
      }
    });
  });
  // 2. urgencia sin 661200
  const urg=[...billed].filter(c=>BYCODE[c].flags.urgencia);
  if(urg.length&&!billed.has('661200'))
    findings.push({sev:'advertencia',msg:`Hay ${urg.length} práctica(s) de urgencia (${urg.map(link).join(', ')}) pero falta el código ${link('661200')} <b>Urgencias</b>, que debe adicionarse a la prescripción.`});
  // 3. acto bioquímico
  const hasAB=['660001','661001','662001'].some(c=>billed.has(c));
  const anyLab=[...billed].some(c=>c!=='660001'&&['PMO','PE'].includes(BYCODE[c].seccion));
  if(anyLab&&!hasAB)
    findings.push({sev:'advertencia',msg:`No se incluyó el Acto Bioquímico ${link('660001')}, que se factura 1 vez por prescripción (o ${link('661001')} ABI si es internación).`});
  // 4. desuso
  [...billed].filter(c=>BYCODE[c].flags.desuso).forEach(c=>
    findings.push({sev:'advertencia',msg:`${link(c)} <b>${esc(nm(c))}</b> está en desuso / por presupuesto (#): sin U.B. de referencia.`}));
  // 4b. seriado / frecuencia excedido
  [...billed].forEach(c=>{const s=BYCODE[c].seriado;if(s&&qty[c]>s.max)
    findings.push({sev:'advertencia',msg:`${link(c)} facturado <b>×${qty[c]}</b> supera el seriado habitual (máx. ×${s.max}). ${esc(s.nota)}`});});
  // 5. inexistentes
  unknown.forEach(u=>findings.push({sev:'rechazo',msg:`El código <span class="mono">${esc(u)}</span> no existe en el NBU cargado. Verificá el número.`}));
  if(!findings.length)findings.push({sev:'ok',msg:`Sin observaciones: los ${billed.size} códigos son válidos y no presentan conflictos de inclusión.`});

  // totals (× cantidad, netas de redundantes)
  let totalUB=0; billed.forEach(c=>{const _u=getUB(BYCODE[c]);if(!redundant.has(c)&&_u!=null)totalUB+=_u*qty[c];});
  const rechazos=findings.filter(f=>f.sev==='rechazo').length;
  const adverts=findings.filter(f=>f.sev==='advertencia').length;
  const order={rechazo:0,advertencia:1,info:2,ok:3};
  findings.sort((a,b)=>order[a.sev]-order[b.sev]);
  const ICON={rechazo:'✕',advertencia:'!',info:'i',ok:'✓'};
  lastVal={uniq,qty,redundant:[...redundant],ubVal};

  const money=ubVal>0?`<div class="vstat money"><div class="vn">${fmtMoney(totalUB*ubVal)}</div><div class="vl">Arancel estimado (U.B. × ${fmtMoney(ubVal)})</div></div>`:'';
  const summary=`<div class="vsummary">
    <div class="vstat"><div class="vn">${billed.size}</div><div class="vl">Códigos válidos</div></div>
    <div class="vstat ${rechazos?'err':''}"><div class="vn">${rechazos}</div><div class="vl">Rechazos</div></div>
    <div class="vstat ${adverts?'warn':''}"><div class="vn">${adverts}</div><div class="vl">Advertencias</div></div>
    <div class="vstat ${(!rechazos&&!adverts)?'ok':''}"><div class="vn">${totalUB.toLocaleString('es-AR',{maximumFractionDigits:1})}</div><div class="vl">U.B. facturables${redundant.size?' (netas)':''}</div></div>
    ${money}
  </div>`;

  const rows=uniq.map(c=>{
    const q=qty[c]>1?`<span class="vqty">×${qty[c]}</span>`:`<span class="vqty" style="color:var(--faint)">—</span>`;
    if(!BYCODE[c])return `<div class="vtrow dim"><span class="vc">${esc(c)}</span><span class="vnm" style="color:var(--exc)">No encontrado en el NBU</span>${q}<span class="vub">—</span><span class="vstatus st-inc">rechazo</span></div>`;
    const r=BYCODE[c];let st='<span class="vstatus st-ok">correcto</span>';
    if(redundant.has(c))st='<span class="vstatus st-inc">incluido en módulo</span>';
    else if(r.flags.desuso)st='<span class="vstatus st-desuso"># desuso</span>';
    else if(r.seriado&&qty[c]>r.seriado.max)st='<span class="vstatus st-dup">excede seriado</span>';
    const _uv=getUB(r);const ub=_uv!=null?_uv+' UB':'—';
    return `<div class="vtrow${redundant.has(c)?' dim':''}"><span class="vc" data-code="${c}">${c}</span><span class="vnm">${esc(r.nombre)}</span>${q}<span class="vub">${ub}</span>${st}</div>`;
  }).join('');

  const sl='font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700';
  el('vresults').innerHTML=summary+
    `<div class="exportbtns" style="margin-top:14px;justify-content:flex-end">
       <button class="xbtn" id="vExpCsv">⬇ CSV</button><button class="xbtn" id="vPrint">🖨 PDF</button></div>`+
    `<div class="sec" style="margin-top:12px"><div class="slabel" style="${sl};margin-bottom:9px">Hallazgos</div><div class="findings">`+
    findings.map(f=>`<div class="finding ${f.sev}"><div class="ficon">${ICON[f.sev]}</div><div class="fbody">${f.msg}</div></div>`).join('')+
    `</div></div>`+
    `<div class="sec" style="margin-top:16px"><div class="slabel" style="${sl};margin-bottom:9px">Detalle por código (${uniq.length})</div><div class="vtable">${rows}</div></div>`;
  el('vExpCsv').addEventListener('click',exportValidatorCSV);
  el('vPrint').addEventListener('click',()=>{
    el('printHead').innerHTML=`<h2>Manual NBU — Validación de facturación</h2><p>${new Date().toLocaleDateString('es-AR')} · ${uniq.length} códigos${ubVal>0?' · U.B. $'+ubVal:''}</p>`;
    window.print();
  });
}
function exportValidatorCSV(){
  if(!lastVal)return;
  const {uniq,qty,ubVal}=lastVal; const redundant=new Set(lastVal.redundant); const money=ubVal>0;
  const header=['Código','Cantidad','Nombre','Sección','U.B. unit.','U.B. total'];if(money)header.push('Arancel $');header.push('Estado');
  const rows=[header];
  uniq.forEach(c=>{
    if(!BYCODE[c]){rows.push([c,qty[c],'NO ENCONTRADO EN EL NBU','','','',...(money?['']:[]),'rechazo']);return;}
    const r=BYCODE[c];const red=redundant.has(c);const ubU=getUB(r);
    const ubT=(ubU!=null&&!red)?ubU*qty[c]:0;
    const st=red?'incluido en módulo (no facturar)':(r.flags.desuso?'desuso':(r.seriado&&qty[c]>r.seriado.max?'excede seriado':'correcto'));
    const row=[c,qty[c],r.nombre,r.seccion,ubU??'',red?0:(ubU!=null?ubT:'')];
    if(money)row.push(ubT?(ubT*ubVal).toFixed(2):'0');
    row.push(st);rows.push(row);
  });
  downloadCSV('NBU_validacion_facturacion.csv',rows);
}

/* ---------- drawer / detail ---------- */
function codechip(code,cls){
  const t=BYCODE[code];
  const name=t?esc(t.nombre):'código externo';
  const label=t?t.code:code;
  return `<button class="codechip ${cls}" data-goto="${code}">${label}<small>${name}</small></button>`;
}
let currentCode=null;
function openCode(code){
  const c=BYCODE[code];
  if(!c)return;
  currentCode=code;
  if(window.NBUProfile&&NBUProfile.pushRecent)NBUProfile.pushRecent(code);
  location.hash=code;
  const f=c.flags;
  const nomBadge={NBU:['b-pmo','NBU'],PMO:['b-med','PMO'],ODO:['b-odo','ODO']}[c.nomenclador]||['b-pmo','NBU'];
  const dbadges=[`<span class="badge ${nomBadge[0]}">${nomBadge[1]}</span>`,
                 `<span class="badge ${SEC_CLASS[c.seccion]}">${c.seccion_label}</span>`];
  if(f.urgencia)dbadges.push('<span class="tag t-urg">Urgencia · U</span>');
  if(f.requiere_norma)dbadges.push('<span class="tag t-norma">Requiere norma · N</span>');
  if(f.desuso)dbadges.push('<span class="tag t-desuso"># en desuso</span>');
  if(f.pcr)dbadges.push('<span class="pill">PCR</span>');
  if(c.en_catalogo_pmo)dbadges.push('<span class="tag t-med">También en Catálogo PMO</span>');

  let html=`<div class="dhead">
    <div>
      <div class="dcode">${c.code}</div>
    </div>
    <span class="dstar${FAVS.has(code)?' on':''}" id="dstar" role="button" title="Marcar favorito" aria-label="Favorito">${FAVS.has(code)?'★':'☆'}</span>
    <button class="icon-btn x" id="closeDrawer" aria-label="Cerrar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>`;
  const note=(window.NBUProfile&&NBUProfile.getNote)?(NBUProfile.getNote(code)||''):'';
  html+=`<div class="dbody">
    <div>
      <div class="dname">${esc(c.nombre)}${(c._orig&&c._orig.nombre!==c.nombre)?'<span class="ovr-badge">editado</span>':''}</div>
      <div class="dbadges">${dbadges.join('')}</div>
      <div class="dactions">
        ${c.nomenclador==='NBU'?`<button class="minibtn" id="dAddVal">➕ Al validador</button>`:''}
        <button class="minibtn" id="dCopy">⧉ Copiar código</button>
      </div>
      ${(window.NBUProfile&&NBUProfile.canEdit())?`<div class="dedit"><button class="minibtn" id="editFichaBtn">✎ Editar ficha</button></div>`:''}
      ${(window.NBUProfile&&NBUProfile.active())?`<div class="dnote"><textarea id="dNote" placeholder="Tu nota personal para este código (privada de tu perfil)…">${esc(note)}</textarea></div>`:''}
    </div>`;

  // equivalencia entre nomencladores (Único <-> Prestaciones médicas)
  if(c.nomenclador==='UNICO'){
    const e=c.equivalencia;
    if(c.sin_equivalencia||!e){
      html+=`<div class="sec"><div class="slabel">Equivalencia</div><div class="equiv-card" style="background:var(--urg-soft);border-color:color-mix(in srgb,var(--urg) 30%,transparent)"><b style="color:var(--urg)">⚠ Sin equivalencia hallada</b><div style="margin-top:5px;font-size:13px;color:var(--ink-2)">Este código del Nomenclador Único no tiene equivalencia automática en Prestaciones Médicas. Queda <b>pendiente de mapeo manual</b> (filtro “Sin equivalencia”).</div></div></div>`;
    } else {
      const scorePct=e.score!=null?Math.round(e.score*100)+'%':'';
      html+=`<div class="sec"><div class="slabel">Equivalencia · ${esc(e.target_label||'')}</div><div class="equiv-card">
        <div class="eqrow"><span>Equivale a</span><span class="eqcode" ${e.key?`data-goto="${e.key}"`:''}>${e.code}</span>${scorePct?`<span class="eqscore">similitud ${scorePct}</span>`:''}</div>
        ${e.desc?`<div style="margin-top:6px;font-size:13px;color:var(--ink-2)">${esc(e.desc)}</div>`:''}
        <div style="margin-top:6px;font-size:11.5px;color:var(--faint)">${e.key?'Presente en ambos nomencladores. Tocá el código para abrir su ficha en '+esc(e.target_label||'')+'.':'El código equivalente ('+esc(e.code)+') no está cargado como ficha propia todavía.'}</div>
      </div></div>`;
    }
  }
  if(c.equivalencia_unico&&c.equivalencia_unico.length){
    const items=c.equivalencia_unico.map(u=>{const pct=u.score!=null?Math.round(u.score*100)+'%':'';return `<div class="eqrow" style="margin-top:6px"><span class="eqcode" data-goto="${u.unico_key}">${u.unico_code}</span>${pct?`<span class="eqscore">similitud ${pct}</span>`:''}<span style="font-size:12.5px;color:var(--ink-2)">${esc((u.unico_desc||'').slice(0,70))}</span></div>`;}).join('');
    html+=`<div class="sec"><div class="slabel">También en Nomenclador Único (VISITAR)</div><div class="equiv-card"><div style="font-size:12.5px;color:var(--ink-2);margin-bottom:2px">Presente en ambos nomencladores.</div>${items}<div style="margin-top:6px;font-size:11.5px;color:var(--faint)">Tocá el código para abrir su ficha en el Nomenclador Único.</div></div></div>`;
  }

  // valor
  const v=c.valor;
  const ubEff=getUB(c);
  const aran=aranStr(ubEff);
  const novalor=c.nomenclador==='PMO'?'Prestación del Catálogo PMO — cobertura obligatoria':'Sin valor de referencia (por presupuesto)';
  if(!(c.nomenclador==='UNICO'&&getUB(c)==null))html+=`<div class="sec"><div class="slabel">Valorización</div><div class="valcard">
    ${ubEff!=null?`<div class="big">${ubEff}</div><div class="lbl">${v.unidad}${v.ub_vigente!=null?' · <b style="color:var(--new)">vigente</b>':''}</div>`:`<div class="lbl" style="font-size:15px;color:var(--ink)">${novalor}</div>`}
    ${aran?`<div class="big" style="color:var(--accent-ink)">${aran}</div><div class="lbl">arancel (U.B. × ${fmtMoney(ubValue)})</div>`:''}
    <div class="arancel">${aran?'Arancel calculado con el valor de U.B. que cargaste arriba.':esc(v.arancel)}</div>
    ${v.ub_vigente!=null?`<div class="val2024">U.B. <b>vigente</b> (act. al día): <b>${v.ub_vigente}</b>${v.ub!=null&&v.ub!==v.ub_vigente?` · base v2016: ${v.ub}`:''}${v.ub_actualizado_2024!=null&&v.ub_actualizado_2024!==v.ub_vigente?` · Anexo 2024: ${v.ub_actualizado_2024}`:''}</div>`
      :(v.ub_actualizado_2024!=null?`<div class="val2024">Anexo Enero 2024 · U.B. actualizada: <b>${v.ub_actualizado_2024}</b>${v.ub!=null?` (base v2016: ${v.ub})`:''}${aran?` · arancel 2024: <b>${fmtMoney(v.ub_actualizado_2024*ubValue)}</b>`:''}</div>`:'')}
  </div></div>`;

  // valorización Nomenclador Nacional (galenos) — códigos médicos con valores validados
  if(c.valores){
    const g=c.valores.galeno, pz=c.valores.pesos_2002, dental=c.valores.tipo==='odontologia';
    const gv=v=>v!=null?`${(+v).toLocaleString('es-AR')} <small style="color:var(--faint)">gal.</small>`:'—';
    const rows = dental ? [
      ['Honorarios',g.honorarios,pz.honorarios],
      ['Gasto',g.gastos,pz.gastos],
    ].filter(r=>r[1]!=null||r[2]!=null) : [
      ['Especialista (honorario)',g.especialista,pz.especialista],
      [g.ayudantes_n?`Ayudantes (×${g.ayudantes_n})`:'Ayudantes',g.ayudante_c_u,pz.ayudantes],
      ['Anestesista',g.anestesista,pz.anestesista],
      ['Gasto',g.gasto,pz.gasto],
    ].filter(r=>r[1]!=null||r[2]!=null);
    const totalLbl = dental ? 'Valor práctica (ref. 2002)' : 'Total intervención (ref. 2002)';
    const totalVal = dental ? c.valores.valor_practica_2002 : c.valores.total_2002;
    const vok = c.valores.validado;
    html+=`<div class="sec"><div class="slabel">Valorización · Nomenclador Nacional ${vok?'<span style="color:var(--inc);font-weight:700">✓ validado</span>':'<span style="color:var(--urg);font-weight:700">sin validar</span>'}</div>
      <div class="vtable" style="box-shadow:none">
      ${rows.map(([lbl,gal,pes])=>`<div class="vtrow" style="grid-template-columns:1fr auto auto!important"><span class="vnm">${lbl}</span><span class="vub">${gv(gal)}</span><span class="vub" style="color:var(--muted)">${pes!=null?fmtMoney(pes):'—'}</span></div>`).join('')}
      ${totalVal!=null?`<div class="vtrow" style="grid-template-columns:1fr auto!important;background:var(--surface-2)"><span class="vnm" style="font-weight:700">${totalLbl}</span><span class="vub" style="color:var(--ink);font-weight:700">${fmtMoney(totalVal)}</span></div>`:''}
      ${dental&&c.valores.coseguro_pct!=null?`<div class="vtrow" style="grid-template-columns:1fr auto!important"><span class="vnm">Coseguro máximo</span><span class="vub" style="color:var(--odo);font-weight:700">${(+c.valores.coseguro_pct).toLocaleString('es-AR')}%</span></div>`:''}
      </div>
      <div style="font-size:11.5px;color:var(--faint);margin-top:7px;font-style:italic">Galenos del Nomenclador Nacional (Res. 201/02${dental?'; valores a marzo 1991':''}). Los $ son valor de referencia; el arancel vigente surge de multiplicar los galenos por el valor de galeno del convenio.</div>
    </div>`;
  }

  // frecuencia / seriado
  if(c.seriado||(c.frecuencia&&c.frecuencia.length)){
    html+=`<div class="sec"><div class="slabel">Frecuencia / seriado</div><div class="freq-note">`;
    if(c.seriado)html+=`<span class="seriado-b">${esc(c.seriado.nota)}</span><br>`;
    if(c.frecuencia&&c.frecuencia.length)html+=c.frecuencia.map(fr=>linkCodes(esc(fr))).join('<br>');
    html+=`</div></div>`;
  }

  // asociación de códigos / qué cargar (médico PMO, odontología y Único médico)
  if((c.nomenclador==='PMO' && c.seccion==='PMO_MED') || c.nomenclador==='ODO' || (c.nomenclador==='UNICO'&&c.unico_tipo==='med')){
    const isOdo=c.nomenclador==='ODO';
    const pref=c.code.slice(0,2);
    const nm=isOdo?null:(DB.meta.pmo_normas_capitulo||{})[pref];
    const esp=c.asociaciones_especificas||(DB.meta.pmo_asociaciones||{})[c.code]||[];
    if(nm||esp.length){
      html+=`<div class="sec"><div class="slabel">Asociación de códigos · qué cargar</div><div class="freq-note" style="background:color-mix(in srgb,var(--med) 9%,transparent);border-color:color-mix(in srgb,var(--med) 26%,transparent)">`;
      if(esp.length)html+=`<div style="margin-bottom:8px"><b style="color:var(--med)">Para este código:</b><br>${esp.map(e=>'• '+linkCodes(esc(e))).join('<br>')}</div>`;
      if(nm){
        html+=`<b class="seriado-b" style="color:var(--med)">Norma general del capítulo (${esc((DB.meta.pmo_capitulos||{})[pref]||'')})</b>`;
        html+=`<ul style="margin:6px 0 0;padding-left:2px;list-style:none">${nm.que_cargar.map(x=>`<li style="margin-bottom:5px">• ${linkCodes(esc(x))}</li>`).join('')}</ul>`;
        if(nm.ver_tambien&&nm.ver_tambien.length)
          html+=`<div style="margin-top:7px;font-size:12px;color:var(--muted)">Ver también capítulos: ${nm.ver_tambien.map(v=>`<b>${v}</b> (${esc((DB.meta.pmo_capitulos||{})[v]||'')})`).join(' · ')}</div>`;
      }
      html+=`<div style="margin-top:9px;font-size:11.5px;color:var(--faint);font-style:italic">${esc(DB.meta.pmo_normas_nota||'')}</div>`;
      html+=`</div></div>`;
    }
  }

  // nota de asociación agregada por el administrador
  if(c.asoc_extra){
    html+=`<div class="sec"><div class="slabel">Asociación de códigos · nota interna<span class="ovr-badge">editado</span></div><div class="freq-note" style="background:var(--accent-soft);border-color:var(--accent)">${linkCodes(esc(c.asoc_extra)).replace(/\n/g,'<br>')}</div></div>`;
  }

  // sinonimos / abreviaturas
  if((c.sinonimos&&c.sinonimos.length)||(c.abreviaturas&&c.abreviaturas.length)){
    html+=`<div class="sec">`;
    if(c.abreviaturas&&c.abreviaturas.length)
      html+=`<div class="slabel">Abreviaturas</div><div class="chipset">${c.abreviaturas.map(a=>`<span class="pill">${esc(a)}</span>`).join('')}</div>`;
    if(c.sinonimos&&c.sinonimos.length)
      html+=`<div class="slabel" style="margin-top:6px">Sinónimos</div><div class="chipset">${c.sinonimos.map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div>`;
    html+=`</div>`;
  }

  // auditoria tips
  if(c.auditoria&&c.auditoria.length){
    const edA=c._orig&&JSON.stringify(c._orig.auditoria)!==JSON.stringify(c.auditoria);
