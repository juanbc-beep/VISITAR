/* ============================================================
   Perfiles · Administrador · Sincronización (Supabase)
   ============================================================ */
(function(){
  const KEY={auth:'nbu-auth-v2',content:'nbu-content-v1',sync:'nbu-sync-cfg'};
  const enc=new TextEncoder();
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;}};
  const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
  const E=s=>(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

  let AUTH=load(KEY.auth,{company:null,profiles:[],updated:0});
  let CONTENT=load(KEY.content,{codes:{},page:{},updated:0});
  let SYNC=load(KEY.sync,{url:'',key:'',enabled:false});
  let current=null, companyAuthed=false, editMode=false, gView='';
  let syncState={ok:null,msg:'',ts:0}, pollT=null;

  const H1=document.querySelector('header h1'), SUB=document.querySelector('header .brand p');
  const DEF={title:H1?H1.textContent:'',subtitle:SUB?SUB.textContent:''};

  /* ---- crypto (PBKDF2/SHA-256) ---- */
  const ITER=310000; // OWASP-recommended minimum for PBKDF2-HMAC-SHA256
  const bb=b=>btoa(String.fromCharCode.apply(null,new Uint8Array(b)));
  const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function mkHash(pw,saltB64,iter){
    const it=iter||ITER;
    const salt=saltB64?ub(saltB64):crypto.getRandomValues(new Uint8Array(16));
    const k=await crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},k,256);
    return {hash:bb(bits),salt:saltB64||bb(salt),it};
  }
  async function check(pw,rec){if(!rec)return false;const r=await mkHash(pw,rec.salt,rec.it||120000);return r.hash===rec.hash;}
  // brute-force throttling (soft, client-side) + auto-logout por inactividad
  const LOCK={};let idleT=null;const IDLE_MS=25*60*1000;
  function lockKey(id){return id||'_company';}
  function lockedFor(id){const l=LOCK[lockKey(id)];if(!l)return 0;const rem=Math.ceil((l.until-Date.now())/1000);return rem>0?rem:0;}
  function noteFail(id){const k=lockKey(id);const l=LOCK[k]||{n:0,until:0};l.n++;if(l.n>=5){l.until=Date.now()+30000;l.n=0;}LOCK[k]=l;}
  function noteOk(id){delete LOCK[lockKey(id)];}
  function resetIdle(){if(!current)return;clearTimeout(idleT);idleT=setTimeout(()=>{if(current){current=null;editMode=false;document.body.classList.remove('editmode-on');toast('Sesión cerrada por inactividad');renderGate('profiles');gate.hidden=false;}},IDLE_MS);}
  ['mousemove','keydown','click','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(current)resetIdle();},{passive:true}));

  function logoInner(){return CONTENT.page.logo?`<img src="${CONTENT.page.logo}" alt="VISITAR SRL">`:'VISITAR';}

  /* ---- cifrado opcional de la sincronización (AES-GCM) ---- */
  const ENC_SALT=enc.encode('visitar-nbu-sync-v1');
  let encKey=null;
  async function deriveEncKey(pass){
    const k=await crypto.subtle.importKey('raw',enc.encode(pass),{name:'PBKDF2'},false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:ENC_SALT,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  async function encPayload(obj){
    if(!encKey)return obj;
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},encKey,enc.encode(JSON.stringify(obj)));
    return {enc:1,iv:bb(iv),ct:bb(ct)};
  }
  async function decPayload(val){
    if(!val||!val.enc)return val;
    if(!encKey)throw new Error('falta clave de cifrado');
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(val.iv)},encKey,ub(val.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function initEnc(){try{encKey=SYNC.encPass?await deriveEncKey(SYNC.encPass):null;}catch(e){encKey=null;}}

  /* ---- registro de auditoría de ediciones ---- */
  function logEdit(action,code){CONTENT.log=CONTENT.log||[];CONTENT.log.unshift({t:Date.now(),who:current?current.name:'',action,code:code||''});if(CONTENT.log.length>200)CONTENT.log.length=200;}

  function persistAuth(){AUTH.updated=Date.now();save(KEY.auth,AUTH);queuePush('auth',AUTH);}
  function persistContent(){CONTENT.updated=Date.now();save(KEY.content,CONTENT);queuePush('content',CONTENT);}

  /* ---- toast ---- */
  let toastEl=null;
  function toast(msg,err){
    if(!toastEl){toastEl=document.createElement('div');toastEl.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:1200;padding:10px 16px;border-radius:9px;font:600 13px var(--font-ui);color:#fff;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center';document.body.appendChild(toastEl);}
    toastEl.style.background=err?'var(--exc)':'var(--accent-ink)';toastEl.textContent=msg;toastEl.style.opacity='1';
    clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.style.opacity='0',2600);
  }

  /* ---- content overrides ---- */
  function rebuildH(c){try{c._h=norm([c.code,c._key,c.nombre].concat(c.sinonimos||[],c.abreviaturas||[]).join(' '));}catch(e){}}
  function applyCode(code){
    const c=BYCODE[code]; if(!c)return; const ov=CONTENT.codes[code];
    if(!c._orig)c._orig={nombre:c.nombre,norma:c.norma?JSON.parse(JSON.stringify(c.norma)):null,auditoria:c.auditoria?c.auditoria.slice():null,asoc_extra:c.asoc_extra||null};
    c.nombre=(ov&&ov.nombre!=null&&ov.nombre!=='')?ov.nombre:c._orig.nombre;
    c.norma=(ov&&'norma'in ov)?ov.norma:c._orig.norma;
    c.auditoria=(ov&&'auditoria'in ov)?ov.auditoria:c._orig.auditoria;
    c.asoc_extra=(ov&&ov.asoc_extra)?ov.asoc_extra:(c._orig.asoc_extra||null);
    rebuildH(c);
  }
  function applyContent(){
    Object.keys(BYCODE).forEach(code=>{if(BYCODE[code]._orig&&!CONTENT.codes[code])applyCode(code);});
    Object.keys(CONTENT.codes).forEach(applyCode);
    if(H1)H1.textContent=CONTENT.page.title||DEF.title;
    if(SUB)SUB.textContent=CONTENT.page.subtitle||DEF.subtitle;
    const bl=el('brandLogo');if(bl){bl.classList.toggle('hasimg',!!CONTENT.page.logo);bl.innerHTML=logoInner();}
  }

  /* ---- Supabase sync (REST + polling) ---- */
  const base=()=>SYNC.url.replace(/\/+$/,'');
  const hdr=()=>({'apikey':SYNC.key,'Authorization':'Bearer '+SYNC.key,'Content-Type':'application/json'});
  async function testConn(){
    const r=await fetch(base()+'/rest/v1/kv?select=key&limit=1',{headers:hdr()});
    if(!r.ok)throw new Error('HTTP '+r.status+' — '+(await r.text()).slice(0,140));
    return true;
  }
  let pushT=null,pushQ={};
  function queuePush(k,obj){if(!SYNC.enabled)return;pushQ[k]=obj;clearTimeout(pushT);pushT=setTimeout(flushPush,700);}
  async function flushPush(){
    if(!SYNC.enabled)return;
    const snap=pushQ;pushQ={};const keys=Object.keys(snap);
    if(!keys.length)return;
    const items=[];for(const k of keys){items.push({key:k,value:await encPayload(snap[k]),updated_at:new Date().toISOString()});}
    try{const r=await fetch(base()+'/rest/v1/kv',{method:'POST',headers:Object.assign({'Prefer':'resolution=merge-duplicates,return=minimal'},hdr()),body:JSON.stringify(items)});
      setSync(r.ok?true:false,r.ok?'Sincronizado':'Error al subir ('+r.status+')');}catch(e){setSync(false,'Sin conexión');}
  }
  function mergeAuth(remote){
    let changed=false;
    if(remote.company&&(!AUTH.company||(remote.updated||0)>(AUTH.updated||0))){AUTH.company=remote.company;changed=true;}
    const byId={};AUTH.profiles.forEach(p=>byId[p.id]=p);
    (remote.profiles||[]).forEach(rp=>{const lp=byId[rp.id];
      if(!lp){AUTH.profiles.push(rp);byId[rp.id]=rp;changed=true;}
      else if((rp.updated||0)>(lp.updated||0)){Object.assign(lp,rp);changed=true;}});
    if(changed)AUTH.updated=Math.max(AUTH.updated||0,remote.updated||0,Date.now()-1);
    return changed;
  }
  async function pull(){
    if(!SYNC.enabled)return;
    try{
      const r=await fetch(base()+'/rest/v1/kv?select=key,value,updated_at',{headers:hdr()});
      if(!r.ok){setSync(false,'Error al leer ('+r.status+')');return;}
      const rows=await r.json();let cChg=false,aChg=false,decErr=false;
      for(const row of rows){
        let val;try{val=await decPayload(row.value);}catch(e){decErr=true;continue;}
        if(row.key==='auth'&&val&&mergeAuth(val))aChg=true;
        if(row.key==='content'&&val&&(val.updated||0)>(CONTENT.updated||0)){CONTENT=val;save(KEY.content,CONTENT);cChg=true;}
      }
      if(decErr){setSync(false,'Clave de cifrado incorrecta');return;}
      if(aChg){save(KEY.auth,AUTH);
        if(current){const cp=AUTH.profiles.find(p=>p.id===current.id);if(cp){current=cp;FAVS.clear();(cp.favs||[]).forEach(x=>FAVS.add(x));if(cp.ub!=null)ubValue=cp.ub;refreshStats();}}
        if(gView==='profiles')renderGate('profiles');
      }
      if(cChg){applyContent();}
      if(cChg||aChg){if(state.view==='list')render();if(el('drawer').classList.contains('on')&&currentCode)openCode(currentCode);}
      setSync(true,'Sincronizado');
    }catch(e){setSync(false,'Sin conexión');}
  }
  function startPolling(){if(pollT||!SYNC.enabled)return;pollT=setInterval(pull,12000);}
  function stopPolling(){clearInterval(pollT);pollT=null;}
  function setSync(ok,msg){syncState={ok,msg,ts:Date.now()};const dot=el('syncDot');if(dot)renderSyncDot(dot);}
  function renderSyncDot(dot){
    const on=SYNC.enabled;
    dot.className='syncdot'+(!on?'':(syncState.ok===false?' err':(syncState.ok?' on':'')));
    dot.innerHTML=`<i></i>${on?(syncState.msg||'Nube activa'):'Nube desactivada'}`;
  }

  /* ============ GATE (acceso) ============ */
  const gate=el('gate');
  function showGate(v){renderGate(v);gate.hidden=false;}
  function hideGate(){gate.hidden=true;}
  function field(id,label,type){return `<label for="${id}">${label}</label><input id="${id}" type="${type||'text'}" autocomplete="off">`;}
  function renderGate(v){
    gView=v;
    let html='';
    if(v==='setup'){
      html=`<div class="gcard">
        <div class="glogo brand${CONTENT.page.logo?' hasimg':''}">${logoInner()}</div>
        <h2>Configurar el acceso</h2>
        <div class="gsub">Primera vez en este equipo. Creá el <b>acceso de la empresa</b> (usuario compartido) y tu <b>perfil administrador</b>.</div>
        <div style="font-weight:800;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--accent-ink);margin-top:6px">Acceso de la empresa</div>
        ${field('suUser','Usuario de la empresa')}
        ${field('suPass','Contraseña de la empresa','password')}
        <div style="font-weight:800;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--accent-ink);margin-top:14px">Tu perfil (administrador)</div>
        ${field('suName','Tu nombre')}
        ${field('suPPass','Tu contraseña personal','password')}
        <div class="gerr" id="gErr"></div>
        <button class="gbtn" id="suGo">Crear acceso y perfil</button>
        <button class="gback" id="suJoin">Ya tenemos un espacio en la nube → conectar</button>
      </div>`;
    } else if(v==='join'){
      html=`<div class="gcard">
        <div class="glogo brand${CONTENT.page.logo?' hasimg':''}">${logoInner()}</div>
        <h2>Conectar a la nube</h2>
        <div class="gsub">Pegá los datos de Supabase de tu empresa para descargar los perfiles ya creados.</div>
        ${field('jUrl','URL del proyecto (https://xxx.supabase.co)')}
        ${field('jKey','Clave pública (anon key)','password')}
        ${field('jEnc','Clave de cifrado (si la empresa la usa)','password')}
        <div class="gerr" id="gErr"></div>
        <button class="gbtn" id="jGo">Conectar y descargar</button>
        <button class="gback" id="jBack">← Volver</button>
      </div>`;
    } else if(v==='company'){
      html=`<div class="gcard">
        <div class="glogo brand${CONTENT.page.logo?' hasimg':''}">${logoInner()}</div>
        <h2>Acceso de la empresa</h2>
        <div class="gsub">Ingresá el usuario y la contraseña que comparte el equipo.</div>
        ${field('cUser','Usuario')}
        ${field('cPass','Contraseña','password')}
        <div class="gerr" id="gErr"></div>
        <button class="gbtn" id="cGo">Ingresar</button>
        ${SYNC.enabled?'':`<button class="gback" id="cJoin">Conectar a la nube (otro equipo)</button>`}
      </div>`;
    } else if(v==='profiles'){
      const visibles=AUTH.profiles.filter(p=>p.role!=='admin');
      const list=visibles.length?visibles.map(p=>`
        <button class="pchip" data-pid="${p.id}">
          <span class="pav">${E((p.name||'?').slice(0,1).toUpperCase())}</span>
          <span><span class="pnm">${E(p.name)}</span><span class="prole">Administrativo</span></span>
        </button>`).join(''):`<div class="gsub" style="text-align:center;padding:8px 0">Todavía no hay perfiles. Creá el tuyo.</div>`;
      html=`<div class="gcard">
        <div class="glogo brand${CONTENT.page.logo?' hasimg':''}">${logoInner()}</div>
        <h2>¿Quién sos?</h2>
        <div class="gsub">Elegí tu perfil para cargar tus favoritos, o creá uno nuevo.</div>
        <div class="gprofiles">${list}</div>
        <button class="gbtn sec" id="pNew" style="margin-top:12px">+ Crear mi perfil</button>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
          <button class="gback" id="pLogout">Cerrar sesión de la empresa</button>
          <button class="gback" id="pAdmin" style="color:var(--faint)">Acceso administrador</button>
        </div>
      </div>`;
    } else if(v==='adminlogin'){
      html=`<div class="gcard">
        <div class="glogo brand${CONTENT.page.logo?' hasimg':''}">${logoInner()}</div>
        <h2>Acceso administrador</h2>
        <div class="gsub">Ingresá tu nombre de administrador y tu contraseña.</div>
        ${field('alName','Nombre de administrador')}
        ${field('alPass','Contraseña','password')}
        <div class="gerr" id="gErr"></div>
        <button class="gbtn" id="alGo">Entrar</button>
        <button class="gback" id="alBack">← Volver</button>
      </div>`;
    } else if(v==='pwd'){
      const p=AUTH.profiles.find(x=>x.id===gate._pid);
      html=`<div class="gcard">
        <div class="glogo">${E((p.name||'?').slice(0,1).toUpperCase())}</div>
        <h2>${E(p.name)}</h2>
        <div class="gsub">Ingresá tu contraseña personal.</div>
        ${field('lPass','Contraseña','password')}
        <div class="gerr" id="gErr"></div>
        <button class="gbtn" id="lGo">Entrar</button>
        <button class="gback" id="lBack">← Elegir otro perfil</button>
      </div>`;
    } else if(v==='newprofile'){
      html=`<div class="gcard">
        <div class="glogo">+</div>
        <h2>Crear mi perfil</h2>
        <div class="gsub">Elegí un nombre y una contraseña personal. Tus favoritos y valor de U.B. quedan guardados para vos.</div>
        ${field('npName','Nombre')}
        ${field('npPass','Contraseña','password')}
        ${field('npPass2','Repetir contraseña','password')}
        <div class="gerr" id="gErr"></div>
        <button class="gbtn" id="npGo">Crear y entrar</button>
        <button class="gback" id="npBack">← Volver</button>
      </div>`;
    }
    gate.innerHTML=html;wireGate(v);
    const first=gate.querySelector('input');if(first)setTimeout(()=>first.focus(),40);
  }
  const gv=id=>{const e=el(id);return e?e.value.trim():'';};
  const gerr=m=>{const e=el('gErr');if(e)e.textContent=m||'';};
  function wireGate(v){
    const onEnter=(fn)=>gate.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')fn();}));
    if(v==='setup'){
      const go=async()=>{
        const cu=gv('suUser'),cp=gv('suPass'),nm=gv('suName'),pp=gv('suPPass');
        if(!cu||!cp)return gerr('Completá usuario y contraseña de la empresa.');
        if(!nm||!pp)return gerr('Completá tu nombre y contraseña personal.');
        if(cp.length<4||pp.length<4)return gerr('Las contraseñas deben tener al menos 4 caracteres.');
        const ch=await mkHash(cp),ph=await mkHash(pp);
        AUTH.company={user:cu,hash:ch.hash,salt:ch.salt,it:ch.it};
        const prof={id:uid(),name:nm,role:'admin',hash:ph.hash,salt:ph.salt,it:ph.it,favs:[],ub:null,created:Date.now(),updated:Date.now()};
        AUTH.profiles=[prof];persistAuth();companyAuthed=true;enterProfile(prof);
      };
      el('suGo').addEventListener('click',go);onEnter(go);
      el('suJoin').addEventListener('click',()=>renderGate('join'));
    } else if(v==='join'){
      el('jGo').addEventListener('click',async()=>{
        const u=gv('jUrl'),k=gv('jKey');if(!u||!k)return gerr('Completá URL y clave.');
        SYNC.url=u;SYNC.key=k;SYNC.encPass=gv('jEnc')||'';
        try{await testConn();await initEnc();SYNC.enabled=true;save(KEY.sync,SYNC);await pull();startPolling();
          if(AUTH.company)renderGate('company');else gerr('Conectado, pero la nube no tiene un acceso configurado todavía. Creá el acceso.');
          if(!AUTH.company)renderGate('setup');
        }catch(e){SYNC.enabled=false;gerr('No se pudo conectar: '+e.message);}
      });
      el('jBack').addEventListener('click',()=>renderGate(AUTH.company?'company':'setup'));
    } else if(v==='company'){
      const go=async()=>{
        const w=lockedFor('_company');if(w)return gerr(`Demasiados intentos. Esperá ${w}s.`);
        if(gv('cUser')!==AUTH.company.user||!(await check(gv('cPass'),AUTH.company))){noteFail('_company');return gerr('Usuario o contraseña incorrectos.');}
        noteOk('_company');companyAuthed=true;renderGate('profiles');
      };
      el('cGo').addEventListener('click',go);onEnter(go);
      if(el('cJoin'))el('cJoin').addEventListener('click',()=>renderGate('join'));
    } else if(v==='profiles'){
      gate.querySelectorAll('.pchip').forEach(b=>b.addEventListener('click',()=>{gate._pid=b.dataset.pid;renderGate('pwd');}));
      el('pNew').addEventListener('click',()=>renderGate('newprofile'));
      el('pLogout').addEventListener('click',()=>{companyAuthed=false;current=null;renderGate('company');});
      el('pAdmin').addEventListener('click',()=>renderGate('adminlogin'));
    } else if(v==='adminlogin'){
      const go=async()=>{
        const w=lockedFor('_admin');if(w)return gerr(`Demasiados intentos. Esperá ${w}s.`);
        const nm=gv('alName').toLowerCase();
        const p=AUTH.profiles.find(x=>x.role==='admin'&&x.name.toLowerCase()===nm);
        if(!p||!(await check(gv('alPass'),p))){noteFail('_admin');return gerr('Datos incorrectos.');}
        noteOk('_admin');enterProfile(p);
      };
      el('alGo').addEventListener('click',go);onEnter(go);
      el('alBack').addEventListener('click',()=>renderGate('profiles'));
    } else if(v==='pwd'){
      const p=AUTH.profiles.find(x=>x.id===gate._pid);
      const go=async()=>{
        const w=lockedFor(p.id);if(w)return gerr(`Demasiados intentos. Esperá ${w}s.`);
        if(!(await check(gv('lPass'),p))){noteFail(p.id);return gerr('Contraseña incorrecta.');}
        noteOk(p.id);enterProfile(p);
      };
      el('lGo').addEventListener('click',go);onEnter(go);
      el('lBack').addEventListener('click',()=>renderGate('profiles'));
    } else if(v==='newprofile'){
      const go=async()=>{
        const nm=gv('npName'),p1=gv('npPass'),p2=gv('npPass2');
        if(!nm)return gerr('Ingresá un nombre.');
        if(AUTH.profiles.some(x=>x.name.toLowerCase()===nm.toLowerCase()))return gerr('Ya existe un perfil con ese nombre.');
        if(p1.length<4)return gerr('La contraseña debe tener al menos 4 caracteres.');
        if(p1!==p2)return gerr('Las contraseñas no coinciden.');
        const ph=await mkHash(p1);
        const prof={id:uid(),name:nm,role:'user',hash:ph.hash,salt:ph.salt,it:ph.it,favs:[],ub:null,created:Date.now(),updated:Date.now()};
        AUTH.profiles.push(prof);persistAuth();enterProfile(prof);
      };
      el('npGo').addEventListener('click',go);onEnter(go);
      el('npBack').addEventListener('click',()=>renderGate('profiles'));
    }
  }

  function enterProfile(p){
    current=p;companyAuthed=true;editMode=false;document.body.classList.remove('editmode-on');
    FAVS.clear();(p.favs||[]).forEach(x=>FAVS.add(x));
    ubValue=(p.ub!=null?p.ub:0);
    el('acctChip').hidden=false;el('acctNm').textContent=p.name;el('acctAv').textContent=(p.name||'?').slice(0,1).toUpperCase();
    const adm=p.role==='admin';el('adminBtn').hidden=!adm;el('editModeBtn').hidden=!adm;
    applyContent();refreshStats();applyMode();render();hideGate();
    if(SYNC.enabled)startPolling();
    resetIdle();
    maybeOnboard();
  }

  /* ============ ADMIN PANEL ============ */
  const amodal=el('adminModal'),abox=el('adminBox');
  function closeAdmin(){amodal.classList.remove('on');}
  amodal.addEventListener('click',e=>{if(e.target===amodal)closeAdmin();});
  let aTab='perfiles';
  function openAdmin(t){aTab=t||aTab;renderAdmin();amodal.classList.add('on');}
  function renderAdmin(){
    const tabs=[['perfiles','Perfiles'],['empresa','Empresa'],['contenido','Textos'],['nube','Nube'],['registro','Registro'],['respaldo','Respaldo']];
    abox.innerHTML=`
      <button class="icon-btn close-x" id="aClose" style="position:absolute;top:16px;right:16px" aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <h3>Administración</h3>
      <div class="asub">Perfil actual: <b>${E(current?current.name:'')}</b> · administrador</div>
      <div class="atabs">${tabs.map(([k,l])=>`<button class="atab${aTab===k?' on':''}" data-t="${k}">${l}</button>`).join('')}</div>
      <div id="aPane"></div>`;
    el('aClose').addEventListener('click',closeAdmin);
    abox.querySelectorAll('.atab').forEach(b=>b.addEventListener('click',()=>{aTab=b.dataset.t;renderAdmin();}));
    renderPane();
  }
  function renderPane(){
    const p=el('aPane');
    if(aTab==='perfiles'){
      p.innerHTML=AUTH.profiles.map(pr=>`
        <div class="arow">
          <span class="pav">${E((pr.name||'?').slice(0,1).toUpperCase())}</span>
          <div class="grow2"><div class="pnm">${E(pr.name)}${current&&pr.id===current.id?' <span style="color:var(--muted);font-weight:500">(vos)</span>':''}</div>
            <div class="pmeta">${pr.role==='admin'?'Administrador':'Administrativo'} · ${(pr.favs||[]).length} favoritos</div></div>
          <button class="minibtn" data-act="role" data-id="${pr.id}">${pr.role==='admin'?'Quitar admin':'Hacer admin'}</button>
          <button class="minibtn" data-act="reset" data-id="${pr.id}">Contraseña</button>
          <button class="minibtn danger" data-act="del" data-id="${pr.id}">Eliminar</button>
        </div>`).join('')+`<button class="minibtn" id="aAddProf" style="margin-top:6px">+ Crear perfil</button>`;
      p.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>profAction(b.dataset.act,b.dataset.id)));
      el('aAddProf').addEventListener('click',async()=>{
        const nm=prompt('Nombre del nuevo perfil:');if(!nm)return;
        if(AUTH.profiles.some(x=>x.name.toLowerCase()===nm.trim().toLowerCase()))return toast('Ya existe ese nombre',true);
        const pw=prompt('Contraseña inicial (mín. 4):');if(!pw||pw.length<4)return toast('Contraseña muy corta',true);
        const ph=await mkHash(pw);AUTH.profiles.push({id:uid(),name:nm.trim(),role:'user',hash:ph.hash,salt:ph.salt,it:ph.it,favs:[],ub:null,created:Date.now(),updated:Date.now()});persistAuth();renderPane();toast('Perfil creado');
      });
    } else if(aTab==='empresa'){
      p.innerHTML=`<label>Usuario de la empresa</label><input id="eUser" type="text" value="${E(AUTH.company?AUTH.company.user:'')}">
        <label>Nueva contraseña de la empresa (dejar vacío para no cambiar)</label><input id="ePass" type="password" autocomplete="off">
        <button class="minibtn" id="eSave" style="margin-top:14px">Guardar cambios</button>
        <div class="ahint" style="margin-top:14px">El acceso de la empresa es compartido por todo el equipo. Al cambiarlo, avisá al personal.</div>`;
      el('eSave').addEventListener('click',async()=>{
        const u=gv('eUser');if(!u)return toast('El usuario no puede quedar vacío',true);
        AUTH.company.user=u;const np=gv('ePass');
        if(np){if(np.length<4)return toast('Contraseña muy corta',true);const h=await mkHash(np);AUTH.company.hash=h.hash;AUTH.company.salt=h.salt;AUTH.company.it=h.it;}
        persistAuth();toast('Acceso de la empresa actualizado');el('ePass').value='';
      });
    } else if(aTab==='contenido'){
      p.innerHTML=`<div class="ahint">Editá los textos generales de la página. El contenido de cada código (nombre, normas, auditoría, asociaciones) se edita desde su ficha con el botón <b>✎ Editar ficha</b> (activá el <b>modo edición</b> en la barra superior).</div>
        <label>Logo de la empresa (PNG/JPG/SVG)</label>
        <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
          <div class="logo${CONTENT.page.logo?' hasimg':''}" style="height:44px">${logoInner()}</div>
          <input id="pgLogo" type="file" accept="image/*" style="border:none;padding:0;background:none;flex:1">
          ${CONTENT.page.logo?'<button class="minibtn danger" id="pgLogoDel">Quitar</button>':''}
        </div>
        <div class="ahint">Se muestra en la barra superior y en las pantallas de acceso. Recomendado: fondo transparente, alto ~80px.</div>
        <label>Título</label><input id="pgTitle" type="text" value="${E(CONTENT.page.title||DEF.title)}">
        <label>Subtítulo</label><input id="pgSub" type="text" value="${E(CONTENT.page.subtitle||DEF.subtitle)}">
        <button class="minibtn" id="pgSave" style="margin-top:14px">Guardar textos</button>
        <button class="minibtn" id="pgReset" style="margin-top:14px;margin-left:6px">Restaurar por defecto</button>
        <div style="margin-top:16px"><div class="pmeta" style="font-weight:700;color:var(--ink)">Fichas con contenido editado: ${Object.keys(CONTENT.codes).length}</div>
        ${Object.keys(CONTENT.codes).length?`<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:5px">${Object.keys(CONTENT.codes).map(c=>`<button class="minibtn" data-goto2="${c}">${c}</button>`).join('')}</div>`:''}</div>`;
      el('pgSave').addEventListener('click',()=>{CONTENT.page.title=gv('pgTitle');CONTENT.page.subtitle=gv('pgSub');logEdit('editó textos generales');persistContent();applyContent();toast('Textos guardados');});
      el('pgReset').addEventListener('click',()=>{const lg=CONTENT.page.logo;CONTENT.page={};if(lg)CONTENT.page.logo=lg;persistContent();applyContent();renderPane();toast('Textos restaurados');});
      el('pgLogo').addEventListener('change',e=>{
        const f=e.target.files[0];if(!f)return;
        if(f.size>400000)return toast('Imagen muy grande (máx. 400 KB)',true);
        const rd=new FileReader();rd.onload=()=>{CONTENT.page.logo=rd.result;logEdit('cambió el logo');persistContent();applyContent();renderPane();toast('Logo actualizado');};rd.readAsDataURL(f);
      });
      if(el('pgLogoDel'))el('pgLogoDel').addEventListener('click',()=>{delete CONTENT.page.logo;persistContent();applyContent();renderPane();toast('Logo quitado');});
      p.querySelectorAll('[data-goto2]').forEach(b=>b.addEventListener('click',()=>{closeAdmin();openCode(b.dataset.goto2);}));
    } else if(aTab==='nube'){
      const project=(SYNC.url||'').replace(/^https?:\/\//,'').split('.')[0];
      p.innerHTML=`<div class="ahint"><b>Sincronización automática con Supabase</b> (gratis). Con esto, los perfiles, favoritos y ediciones se comparten entre todas las computadoras. Solo funciona con el archivo abierto directamente o alojado en la web (no dentro del Artefacto de Claude).</div>
        <div class="syncdot" id="syncDot" style="margin:10px 0"></div>
        <label>URL del proyecto</label><input id="syUrl" type="text" placeholder="https://xxxxx.supabase.co" value="${E(SYNC.url)}">
        <label>Clave pública (anon key)</label><input id="syKey" type="password" placeholder="eyJhbGciOi..." value="${E(SYNC.key)}">
        <label>Clave de cifrado <span style="color:var(--inc)">(recomendada)</span></label><input id="syEnc" type="password" placeholder="frase secreta de la empresa" value="${E(SYNC.encPass||'')}">
        <div class="ahint">Si la cargás, los datos se <b>cifran (AES-256)</b> antes de subir a la nube: ni siquiera con la clave pública se pueden leer sin esta frase. Usá la <b>misma</b> en todas las computadoras. Si la perdés, no se pueden recuperar los datos cifrados.</div>
        <div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap">
          <button class="minibtn" id="syTest">Probar conexión</button>
          <button class="minibtn" id="syEnable">${SYNC.enabled?'Desactivar nube':'Activar y sincronizar'}</button>
          ${SYNC.enabled?'<button class="minibtn" id="syNow">Sincronizar ahora</button>':''}
        </div>
        <div id="syMsg" class="ahint" style="min-height:16px;margin-top:8px"></div>
        <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:700;font-size:12.5px;color:var(--accent-ink)">Paso a paso + SQL para crear el proyecto</summary>
          <div class="ahint" style="margin-top:8px">1. Entrá a <b>supabase.com</b> → creá una cuenta gratis → <b>New project</b>.<br>
          2. En el menú <b>SQL Editor</b>, pegá y ejecutá esto:</div>
          <div class="acode">create table if not exists kv (
  key text primary key,
  value jsonb,
  updated_at timestamptz default now()
);
alter table kv enable row level security;
create policy "kv_all" on kv for all
  to anon using (true) with check (true);</div>
          <div class="ahint" style="margin-top:8px">3. En <b>Project Settings → API</b> copiá el <b>Project URL</b> y la <b>anon public key</b>, pegalos arriba y tocá <b>Activar</b>.<br>
          4. En las otras computadoras, en la pantalla de acceso elegí <b>“conectar a la nube”</b> y pegá los mismos datos.</div>
          <div class="ahint" style="color:var(--urg)">Nota de seguridad: la clave pública queda visible en el archivo. Es un espacio interno de la empresa; no guardes en él información sensible de pacientes.</div>
        </details>`;
      renderSyncDot(el('syncDot'));
      el('syTest').addEventListener('click',async()=>{SYNC.url=gv('syUrl');SYNC.key=gv('syKey');el('syMsg').innerHTML='Probando…';try{await testConn();el('syMsg').innerHTML='<span class="aok">✓ Conexión correcta</span>';}catch(e){el('syMsg').innerHTML='<span class="aerrt">✕ '+E(e.message)+'</span>';}});
      el('syEnable').addEventListener('click',async()=>{
        if(SYNC.enabled){SYNC.enabled=false;save(KEY.sync,SYNC);stopPolling();renderPane();toast('Nube desactivada');return;}
        SYNC.url=gv('syUrl');SYNC.key=gv('syKey');SYNC.encPass=gv('syEnc')||'';if(!SYNC.url||!SYNC.key)return toast('Completá URL y clave',true);
        el('syMsg').innerHTML='Conectando…';
        try{await testConn();await initEnc();SYNC.enabled=true;save(KEY.sync,SYNC);await pull();await flushPushAll();startPolling();renderPane();toast('Nube activada · sincronizando');}
        catch(e){SYNC.enabled=false;el('syMsg').innerHTML='<span class="aerrt">✕ '+E(e.message)+'</span>';}
      });
      if(el('syNow'))el('syNow').addEventListener('click',async()=>{await flushPushAll();await pull();toast('Sincronizado');});
    } else if(aTab==='registro'){
      const log=CONTENT.log||[];
      const fmt=t=>{const d=new Date(t);return d.toLocaleDateString('es-AR')+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});};
      p.innerHTML=`<div class="ahint">Registro de ediciones de contenido (quién cambió qué y cuándo). Se comparte y respalda junto con el resto.</div>
        ${log.length?log.map(e=>`<div class="arow"><div class="grow2"><div class="pnm">${E(e.who||'—')} · <span style="font-weight:500;color:var(--ink-2)">${E(e.action)}</span>${e.code?` <span class="mono" style="color:var(--accent-ink)">${E(e.code)}</span>`:''}</div><div class="pmeta">${fmt(e.t)}</div></div></div>`).join(''):'<div class="ahint">Todavía no hay cambios registrados.</div>'}
        ${log.length?'<button class="minibtn danger" id="logClear" style="margin-top:10px">Vaciar registro</button>':''}`;
      if(el('logClear'))el('logClear').addEventListener('click',()=>{if(confirm('¿Vaciar el registro de cambios?')){CONTENT.log=[];persistContent();renderPane();}});
    } else if(aTab==='respaldo'){
      p.innerHTML=`<div class="ahint">Descargá un respaldo con perfiles y ediciones, o restauralo en otra computadora. (Con la nube activada esto es automático; el respaldo sirve igual como copia de seguridad.)</div>
        <button class="minibtn" id="bkExp" style="margin-top:10px">⬇ Descargar respaldo (.json)</button>
        <label style="margin-top:16px">Restaurar desde archivo</label>
        <input id="bkImp" type="file" accept="application/json,.json" style="border:none;padding:6px 0;background:none">
        <div class="ahint" style="color:var(--urg);margin-top:6px">Restaurar reemplaza los perfiles y ediciones de este equipo.</div>`;
      el('bkExp').addEventListener('click',()=>{
        const blob=new Blob([JSON.stringify({auth:AUTH,content:CONTENT},null,1)],{type:'application/json'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NBU_respaldo.json';a.click();
      });
      el('bkImp').addEventListener('change',e=>{
        const f=e.target.files[0];if(!f)return;const rd=new FileReader();
        rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.auth){AUTH=d.auth;save(KEY.auth,AUTH);}if(d.content){CONTENT=d.content;save(KEY.content,CONTENT);}applyContent();persistAuth();persistContent();renderPane();render();toast('Respaldo restaurado');}catch(err){toast('Archivo inválido',true);}};
        rd.readAsText(f);
      });
    }
  }
  async function flushPushAll(){pushQ.auth=AUTH;pushQ.content=CONTENT;await flushPush();}
  function profAction(act,id){
    const pr=AUTH.profiles.find(x=>x.id===id);if(!pr)return;
    if(act==='role'){
      if(pr.role==='admin'&&AUTH.profiles.filter(x=>x.role==='admin').length<=1)return toast('Debe quedar al menos un administrador',true);
      pr.role=pr.role==='admin'?'user':'admin';pr.updated=Date.now();persistAuth();
      if(current&&current.id===id){const adm=pr.role==='admin';el('adminBtn').hidden=!adm;el('editModeBtn').hidden=!adm;if(!adm){editMode=false;document.body.classList.remove('editmode-on');closeAdmin();}}
      renderPane();
    } else if(act==='reset'){
      const np=prompt('Nueva contraseña para '+pr.name+' (mín. 4):');if(!np)return;if(np.length<4)return toast('Muy corta',true);
      mkHash(np).then(h=>{pr.hash=h.hash;pr.salt=h.salt;pr.it=h.it;pr.updated=Date.now();persistAuth();toast('Contraseña actualizada');});
    } else if(act==='del'){
      if(current&&current.id===id)return toast('No podés eliminar tu propio perfil en uso',true);
      if(pr.role==='admin'&&AUTH.profiles.filter(x=>x.role==='admin').length<=1)return toast('Debe quedar al menos un administrador',true);
      if(!confirm('¿Eliminar el perfil "'+pr.name+'"? Se pierden sus favoritos.'))return;
      AUTH.profiles=AUTH.profiles.filter(x=>x.id!==id);persistAuth();renderPane();toast('Perfil eliminado');
    }
  }

  /* ============ EDITOR DE FICHA ============ */
  function editFicha(code){
    const c=BYCODE[code];if(!c)return;
    const o=c._orig||{};const norma=c.norma||{};
    abox.innerHTML=`
      <button class="icon-btn close-x" id="aClose" style="position:absolute;top:16px;right:16px" aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <h3>Editar ficha · ${E(c.code)}</h3>
      <div class="asub">Los cambios se guardan para todo el equipo. El original queda respaldado (podés restaurarlo).</div>
      <label>Nombre / denominación</label><input id="efNom" type="text" value="${E(c.nombre)}">
      <label>Norma mínima de trabajo</label><textarea id="efTrab">${E(norma.trabajo||'')}</textarea>
      <label>Interpretación</label><textarea id="efInt">${E(norma.interpretacion||'')}</textarea>
      <label>Normas de auditoría / facturación (una por línea)</label><textarea id="efAud" style="min-height:110px">${E((c.auditoria||[]).join('\n'))}</textarea>
      <label>Nota de asociación de códigos (interna)</label><textarea id="efAsoc">${E(c.asoc_extra||'')}</textarea>
      <div style="margin-top:16px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="minibtn" id="efSave">Guardar cambios</button>
        <button class="minibtn danger" id="efReset">Restaurar original</button>
      </div>`;
    el('aClose').addEventListener('click',closeAdmin);
    el('efSave').addEventListener('click',()=>{
      const trab=el('efTrab').value.trim(),intp=el('efInt').value.trim();
      const aud=el('efAud').value.split('\n').map(s=>s.trim()).filter(Boolean);
      const ov={nombre:el('efNom').value.trim(),norma:(trab||intp)?{trabajo:trab,interpretacion:intp}:null,auditoria:aud,asoc_extra:el('efAsoc').value.trim()||null};
      CONTENT.codes[code]=ov;logEdit('editó ficha',code);persistContent();applyCode(code);
      if(state.view==='list')render();closeAdmin();openCode(code);toast('Ficha actualizada');
    });
    el('efReset').addEventListener('click',()=>{
      if(!confirm('¿Restaurar el contenido original de este código?'))return;
      delete CONTENT.codes[code];logEdit('restauró ficha',code);persistContent();applyCode(code);
      if(state.view==='list')render();closeAdmin();openCode(code);toast('Contenido restaurado');
    });
    amodal.classList.add('on');
  }

  /* ============ ONBOARDING (primer uso) ============ */
  const ICN={
    search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    tabs:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v5"/>',
    star:'<path d="M12 3l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 18l-5.9 3 1.2-6.5L2.5 9.9 9.1 9z"/>',
    money:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1.1 1.1-2 2.5-2s2.5.7 2.5 1.8-1 1.6-2.5 1.9-2.5.8-2.5 2 1.1 1.8 2.5 1.8 2.5-.9 2.5-2"/>',
    check:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'
  };
  function obSteps(){
    const s=[
      {i:'tabs',t:'Tres nomencladores en uno',d:'Cambiá entre <b>Laboratorio (NBU)</b>, <b>Prestaciones médicas (PMO)</b> y <b>Odontología</b> con el selector de arriba. Cada sección muestra solo sus códigos.'},
      {i:'search',t:'Buscá al instante',d:'Escribí un <b>código, práctica, sinónimo o abreviatura</b>. Tocá cualquier resultado para ver la ficha completa con normas, relaciones y valores.'},
      {i:'star',t:'Tus favoritos',d:'Marcá con la <b>estrella</b> los códigos que más usás. Quedan guardados en <b>tu perfil</b>: al iniciar sesión los tenés a mano y podés filtrarlos.'},
      {i:'money',t:'Arancel automático',d:'Cargá el <b>valor de la U.B.</b> arriba y la app calcula el <b>arancel en $</b> en el listado, la ficha y el validador. Usa la U.B. vigente actualizada.'},
      {i:'check',t:'Validador de facturación',d:'Pegá una lista de códigos y detectá <b>doble facturación</b>, urgencias sin 661200, seriados excedidos y más. Ideal para auditar antes de presentar.'}
    ];
    if(current&&current.role==='admin')s.push({i:'edit',t:'Sos administrador',d:'Con el botón <b>✎</b> activás el <b>modo edición</b> para corregir el contenido de cada ficha, y con el <b>engranaje</b> gestionás perfiles, el logo y la sincronización.'});
    return s;
  }
  let obIdx=0,obList=[];
  function maybeOnboard(){try{if(localStorage.getItem('nbu-onboarded'))return;}catch(e){}startOnboard();}
  function startOnboard(){obList=obSteps();obIdx=0;el('onboard').classList.add('on');renderOb();}
  function endOnboard(){el('onboard').classList.remove('on');try{localStorage.setItem('nbu-onboarded','1');}catch(e){}}
  function renderOb(){
    const s=obList[obIdx],last=obIdx===obList.length-1;
    el('onboardCard').innerHTML=`
      <button class="obskip" id="obX" style="position:absolute;top:10px;right:10px">Saltar</button>
      <div class="obicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICN[s.i]}</svg></div>
      <h3>${s.t}</h3><p>${s.d}</p>
      <div class="obdots">${obList.map((_,k)=>`<i class="${k===obIdx?'on':''}"></i>`).join('')}</div>
      <div class="obnav">
        ${obIdx>0?'<button class="obskip" id="obPrev">← Atrás</button>':'<span style="flex:1"></span>'}
        <button class="gbtn" id="obNext">${last?'Empezar a usar':'Siguiente'}</button>
      </div>`;
    el('obX').addEventListener('click',endOnboard);
    el('obNext').addEventListener('click',()=>{if(last)endOnboard();else{obIdx++;renderOb();}});
    if(el('obPrev'))el('obPrev').addEventListener('click',()=>{obIdx--;renderOb();});
  }
  el('onboard').addEventListener('click',e=>{if(e.target===el('onboard'))endOnboard();});

  /* ============ header wiring ============ */
  el('acctChip').addEventListener('click',()=>{if(companyAuthed)renderGate('profiles'),gate.hidden=false;});
  el('adminBtn').addEventListener('click',()=>openAdmin());
  el('editModeBtn').addEventListener('click',()=>{
    editMode=!editMode;document.body.classList.toggle('editmode-on',editMode);
    if(el('drawer').classList.contains('on')&&currentCode)openCode(currentCode);
    toast(editMode?'Modo edición activado — abrí una ficha y tocá “Editar ficha”':'Modo edición desactivado');
  });

  /* ============ API pública para el resto de la app ============ */
  let paT=null;
  function persistAuthSoon(){save(KEY.auth,AUTH);clearTimeout(paT);paT=setTimeout(persistAuth,1200);}
  window.NBUProfile={
    active:()=>current,
    canEdit:()=>!!(current&&current.role==='admin'&&editMode),
    saveFavs:(arr)=>{if(current){current.favs=arr.slice();current.updated=Date.now();persistAuth();}},
    saveUB:(val)=>{if(current){current.ub=val;current.updated=Date.now();persistAuth();}},
    editFicha:editFicha,
    tour:startOnboard,
    recent:()=>current&&current.recent?current.recent:[],
    pushRecent:(code)=>{if(!current)return;const r=current.recent=current.recent||[];const i=r.indexOf(code);if(i>=0)r.splice(i,1);r.unshift(code);if(r.length>30)r.length=30;current.updated=Date.now();persistAuthSoon();},
    getNote:(code)=>current&&current.notes?(current.notes[code]||''):'',
    setNote:(code,txt)=>{if(!current)return;current.notes=current.notes||{};if(txt&&txt.trim())current.notes[code]=txt.trim();else delete current.notes[code];current.updated=Date.now();persistAuthSoon();}
  };

  /* ============ init ============ */
  applyContent();
  if(!AUTH.company){showGate('setup');}
  else{showGate('company');}
  if(SYNC.enabled){initEnc().then(()=>{startPolling();pull();});}
})();
})();
</script>
</body>
</html>
