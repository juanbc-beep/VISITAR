# Publica la carpeta web/ en GitHub Pages.
#
# SOLO SE EJECUTA A MANO. La publicación automática en cada push quedó apagada:
# mientras GitHub Pages no esté habilitado en el repositorio, el despliegue falla
# y manda un correo de error por cada cambio subido.
#
# ANTES DE LA PRIMERA PUBLICACION, una sola vez y a mano:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# No se puede automatizar (ver el comentario en el paso configure-pages).
# Para publicar: pestaña Actions -> «Publicar el manual» -> Run workflow.
# Para volver a publicar en cada push, descomentar el bloque «push:» de abajo.
name: Publicar el manual

on:
  workflow_dispatch:
  # push:
  #   branches: [claude/unified-medical-codes-manual-o9nw1w]
  #   paths: ['web/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que la app sea un archivo válido
        run: |
          test -f web/index.html || { echo "Falta web/index.html"; exit 1; }
          test -f web/sw.js || { echo "Falta el service worker"; exit 1; }
          test -f web/manifest.webmanifest || { echo "Falta el manifest"; exit 1; }
          python3 -c "import json;json.load(open('web/manifest.webmanifest'))"
          echo "Tamaño de la app: $(du -h web/index.html | cut -f1)"

      # Probado y descartado: con «enablement: true» la accion intenta crear el
      # sitio de Pages sola y GitHub se lo niega con «Resource not accessible by
      # integration». Crear el sitio pide permisos de administrador del
      # repositorio, y el GITHUB_TOKEN automatico nunca los tiene. No se puede
      # evitar el paso manual de Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
