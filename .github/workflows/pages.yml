# Publica la carpeta web/ en GitHub Pages.
#
# Se publica solo cada vez que cambia la app, y tambien a mano cuando haga falta.
#
# Estuvo en manual un tiempo porque GitHub Pages no estaba habilitado y cada push
# terminaba en un correo de «all jobs have failed». Eso ya esta resuelto: Pages
# quedo configurado en Settings -> Pages -> Source: GitHub Actions.
#
# El filtro «paths» es lo que evita que vuelvan los correos por nada: un cambio en
# docs/ o en scripts/ no toca lo que ve el equipo, asi que no dispara publicacion.
# Para volver al modo manual, comentar el bloque «push:».
#
# Las acciones van fijadas por identificador de commit, no por etiqueta: una
# etiqueta como «v7» se puede mover, y quien controlara esa accion apuntaria a
# otro codigo con permiso para publicar en la direccion del equipo. El
# identificador señala un contenido exacto y no se puede reapuntar. El comentario
# al lado dice a que version corresponde, y es lo que Dependabot usa para avisar
# cuando hay una nueva.
name: Publicar el manual

on:
  workflow_dispatch:
  push:
    branches: [claude/unified-medical-codes-manual-o9nw1w]
    paths: ['web/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # El token del checkout queda escrito en .git/config y cualquier paso
          # posterior podria leerlo. No lo necesitamos despues de clonar.
          persist-credentials: false

      # Sello de origen: deja escrito en la app de que commit salio. Permite
      # verificar que lo publicado corresponde a este repositorio.
      - name: Sellar el origen de la version
        run: |
          FECHA=$(date -u +%Y-%m-%d)
          sed -i "s|window.NBU_BUILD = { commit: \"[^\"]*\", fecha: \"[^\"]*\" }|window.NBU_BUILD = { commit: \"${GITHUB_SHA:0:12}\", fecha: \"${FECHA}\" }|" web/index.html
          grep -n "NBU_BUILD" web/index.html | head -1

      # El navegador decide si hay version nueva comparando sw.js byte a byte.
      # Si la version quedara fija, un cambio en index.html no lo despertaria y
      # la actualizacion dependeria de acordarse de subirla a mano en cada
      # publicacion. Con el sha del commit, cada publicacion es distinta sola.
      - name: Sellar la version en el service worker
        run: |
          sed -i "s|const VERSION = '[^']*'|const VERSION = '${GITHUB_SHA:0:12}'|" web/sw.js
          grep -n "const VERSION" web/sw.js

      # Va DESPUES de los dos sellados: ambos reescriben index.html y eso cambia
      # la huella del script. Si corriera antes, el navegador se negaria a
      # ejecutar el propio codigo de la app.
      - name: Sellar la politica de seguridad con la huella de cada script
        run: python3 scripts/sellar_csp.py web/index.html

      # La base viaja aparte del index.html (ver scripts/inject_db.py). Publicar sin
      # ella deja una app que abre y no muestra ni una practica, asi que se corta
      # aca antes que el equipo se encuentre con eso.
      - name: Verificar que la app este completa
        run: |
          test -f web/index.html || { echo "Falta web/index.html"; exit 1; }
          test -f web/sw.js || { echo "Falta el service worker"; exit 1; }
          test -f web/manifest.webmanifest || { echo "Falta el manifest"; exit 1; }
          python3 -c "import json;json.load(open('web/manifest.webmanifest'))"
          grep -q "nbu_db.bin" web/sw.js || { echo "El service worker no guarda la base"; exit 1; }
          if [ -s web/nbu_db.bin ]; then
            python3 -c "import gzip,json,sys;json.load(gzip.open('web/nbu_db.bin'));print('base aparte OK')"
          else
            grep -q 'id="nbu-db-gz" type="text/plain">[A-Za-z0-9+/]' web/index.html \
              || { echo "No esta la base: ni web/nbu_db.bin ni embebida en el HTML"; exit 1; }
            echo "base embebida en el HTML"
          fi
          echo "Tamaño: index.html $(du -h web/index.html | cut -f1) · base $(du -h web/nbu_db.bin 2>/dev/null | cut -f1 || echo '—')"

      # El build ya sellado (commit, version del SW, CSP), para que el job de
      # Lighthouse mida exactamente estos bytes sin tener que repetir los tres
      # pasos de sellado. Nombre y retencion cortos: nadie necesita este
      # artefacto salvo el paso siguiente, y no es el que se publica (ese es
      # el de «upload-pages-artifact», mas abajo).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-sellado
          path: web
          retention-days: 1

      # Probado y descartado: con «enablement: true» la accion intenta crear el
      # sitio de Pages sola y GitHub se lo niega con «Resource not accessible by
      # integration». Crear el sitio pide permisos de administrador del
      # repositorio, y el GITHUB_TOKEN automatico nunca los tiene. No se puede
      # evitar el paso manual de Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  # Separado de «publicar» a proposito. Medir Lighthouse corre un paquete de
  # npm («npx lighthouse») que no esta fijado por hash como las Actions de
  # arriba, asi que es la unica pieza no verificable de todo este archivo: no
  # hay forma de confirmar que el codigo que se ejecuta es el que uno espera.
  # Si algo en esa cadena de dependencias estuviera comprometido, lo peor que
  # puede tocar es «contents: read» — nunca el token de Pages ni el id-token
  # que firma el despliegue, porque este job ni los pide.
  #
  # No repite el sellado (commit, version del SW, CSP): baja el build ya
  # sellado del job anterior, asi mide los mismos bytes que se publicaron.
  lighthouse:
    needs: publicar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: web-sellado
          path: web

      # Informativo, no bloquea: si Lighthouse o el navegador fallan en el
      # runner, no hay nada que publicar de todos modos porque «publicar» ya
      # termino — «continue-on-error» solo evita que este job quede en rojo
      # por un timeout de red al bajar Chrome, no protege ningun despliegue.
      - name: Medir Core Web Vitals (Lighthouse, informativo)
        continue-on-error: true
        run: |
          python3 -m http.server 8099 --directory web &
          SERVER_PID=$!
          for i in $(seq 1 20); do curl -sf http://localhost:8099/index.html >/dev/null && break; sleep 0.5; done
          npx --yes lighthouse@13.4.1 http://localhost:8099/index.html \
            --output=json --output-path=./lighthouse.json \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices \
            --quiet
          kill "$SERVER_PID" 2>/dev/null || true
          python3 scripts/lighthouse_resumen.py lighthouse.json "$GITHUB_STEP_SUMMARY"
