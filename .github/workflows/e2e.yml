# Prueba la interfaz contra un simulador de Supabase (tests/e2e/).
#
# Por qué existe: hasta ahora esta suite se armaba a mano en el scratchpad de
# cada sesión de Claude Code y se perdía al terminar (ver HANDOFF.md, sección
# de Testing) — cada sesión nueva volvía a explicar el mismo simulador y los
# mismos escenarios, sin red que avise si algo se rompió. Ahora vive acá y
# corre en cada cambio a web/.
#
# Esto NO reemplaza a rls.yml: ahí se prueban las reglas de acceso contra un
# PostgreSQL real. Acá se prueba que la interfaz hace lo correcto asumiendo
# que el servidor cumple esas reglas (ver tests/e2e/LEEME.md).
#
# La acción va fijada por identificador de commit, no por etiqueta, por lo
# mismo que en pages.yml y rls.yml: una etiqueta se puede mover, un commit no.
name: Probar la interfaz

on:
  pull_request:
    paths: ['web/**', 'tests/e2e/**', '.github/workflows/e2e.yml']
  push:
    branches: [claude/unified-medical-codes-manual-o9nw1w]
    paths: ['web/**', 'tests/e2e/**', '.github/workflows/e2e.yml']
  workflow_dispatch:

# Sólo leer el repositorio. Estas pruebas no publican nada ni tocan secretos.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interfaz:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Instalar Playwright y el navegador
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Correr la suite
        working-directory: tests/e2e
        run: bash correr.sh
